function initClipboard(w){
  const K='wcw-clip-'+w.id
  const list=w.querySelector('.clip-list')
  const clearBtn=w.querySelector('.clip-clearbtn')
  const MAX_ITEMS=30,MAX_LEN=2000

  let items=[]
  try{
    const parsed=JSON.parse(localStorage.getItem(K)||'[]')
    if(Array.isArray(parsed))items=parsed.filter(v=>typeof v==='string')
  }catch(e){items=[]}

  function sv(){
    try{localStorage.setItem(K,JSON.stringify(items))}catch(e){}
  }

  function preview(text){
    return text.replace(/\s+/g,' ').trim()
  }

  function render(){
    list.innerHTML=''
    if(!items.length){
      const e=document.createElement('div');e.className='nst';e.textContent='복사한 내용이 여기에 쌓여요'
      list.appendChild(e);return
    }
    items.forEach((text,i)=>{
      const row=document.createElement('div');row.className='clip-item'
      const tx=document.createElement('div');tx.className='clip-text';tx.textContent=preview(text)||'(빈 텍스트)'
      const del=document.createElement('button');del.className='clip-del';del.appendChild(svgIc('i-x'))
      row.appendChild(tx);row.appendChild(del)
      row.addEventListener('click',e=>{
        e.stopPropagation()
        try{
          clipboard.writeText(text)
          lastSeen=text
          row.classList.add('copied')
          setTimeout(()=>row.classList.remove('copied'),450)
        }catch(err){console.error('[WCW] 클립보드 복사 실패:',err)}
      })
      del.addEventListener('click',e=>{
        e.stopPropagation();items.splice(i,1);sv();render()
      })
      list.appendChild(row)
    })
  }

  if(clearBtn){
    clearBtn.addEventListener('mousedown',e=>e.stopPropagation())
    clearBtn.addEventListener('click',e=>{e.stopPropagation();items=[];sv();render()})
  }

  // 안드로이드/웹뷰가 아닌 데스크톱 Electron 환경이라 clipboard.readText()는
  // 항상 동기적으로 즉시 값을 반환한다. 실패 시(권한 등) 예외를 방어한다.
  let lastSeen=''
  try{lastSeen=clipboard.readText()||''}catch(e){lastSeen=''}

  function poll(){
    let cur=''
    try{cur=clipboard.readText()||''}catch(e){return}
    if(!cur||cur===lastSeen)return
    lastSeen=cur
    const trimmed=cur.length>MAX_LEN?cur.slice(0,MAX_LEN):cur
    if(!trimmed.trim())return
    items=items.filter(t=>t!==trimmed)
    items.unshift(trimmed)
    if(items.length>MAX_ITEMS)items.length=MAX_ITEMS
    sv();render()
  }

  render()
  regTimer(w,setInterval(poll,1000))
}

function initLauncher(w){
  const K='wcw-launcher-'+w.id
  const list=w.querySelector('.launch-list')
  const pathInput=w.querySelector('.launch-path')
  const nameInput=w.querySelector('.launch-name')
  const addBtn=w.querySelector('.launch-addbtn')
  const msg=w.querySelector('.launch-msg')

  let items=[]
  try{
    const parsed=JSON.parse(localStorage.getItem(K)||'[]')
    if(Array.isArray(parsed))items=parsed.filter(v=>v&&typeof v.path==='string')
  }catch(e){items=[]}

  function sv(){
    try{localStorage.setItem(K,JSON.stringify(items))}catch(e){}
  }

  function baseName(p){
    if(!p)return '이름 없음'
    const norm=String(p).replace(/[\\/]+$/,'')
    const parts=norm.split(/[\\/]/)
    return parts[parts.length-1]||norm
  }

  function showMsg(text,isError){
    if(!msg)return
    msg.textContent=text
    msg.className='launch-msg '+(isError?'err':'ok')
    clearTimeout(msg._t)
    msg._t=setTimeout(()=>{msg.textContent='';msg.className='launch-msg'},3500)
  }

  function render(){
    list.innerHTML=''
    if(!items.length){
      const e=document.createElement('div');e.className='nst';e.textContent='자주 쓰는 프로그램이나 폴더를 등록해보세요'
      list.appendChild(e);return
    }
    items.forEach((it,i)=>{
      const row=document.createElement('div');row.className='launch-item'
      const info=document.createElement('div');info.className='launch-info'
      const nm=document.createElement('div');nm.className='launch-name-t';nm.textContent=(it.name&&it.name.trim())||baseName(it.path)
      const pt=document.createElement('div');pt.className='launch-path-t';pt.textContent=it.path
      info.appendChild(nm);info.appendChild(pt)
      const del=document.createElement('button');del.className='launch-del';del.appendChild(svgIc('i-x'))
      row.appendChild(info);row.appendChild(del)
      row.addEventListener('click',async e=>{
        e.stopPropagation()
        try{
          // shell.openPath는 성공 시 빈 문자열을, 실패 시 에러 메시지를 반환한다.
          const err=await shell.openPath(it.path)
          if(err)showMsg('실행하지 못했어요: '+err,true)
        }catch(ex){
          console.error('[WCW] 바로가기 실행 실패:',ex)
          showMsg('실행 중 오류가 발생했어요',true)
        }
      })
      del.addEventListener('click',e=>{
        e.stopPropagation();items.splice(i,1);sv();render()
      })
      list.appendChild(row)
    })
  }

  function add(){
    const p=pathInput.value.trim()
    if(!p){showMsg('경로를 입력하거나 파일을 끌어다 놓아주세요',true);return}
    const n=nameInput.value.trim()
    items.push({name:n,path:p})
    sv();render()
    pathInput.value='';nameInput.value=''
  }

  if(addBtn)addBtn.addEventListener('click',e=>{e.stopPropagation();add()})
  ;[pathInput,nameInput].forEach(el=>{
    if(!el)return
    el.addEventListener('mousedown',e=>e.stopPropagation())
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.stopPropagation();e.preventDefault();add()}
    })
  })

  // 윈도우 탐색기에서 파일이나 폴더를 끌어다 놓으면 경로가 자동으로 채워진다.
  if(pathInput){
    ;['dragenter','dragover'].forEach(ev=>pathInput.addEventListener(ev,e=>{
      e.preventDefault();e.stopPropagation();pathInput.classList.add('drag')
    }))
    ;['dragleave','drop'].forEach(ev=>pathInput.addEventListener(ev,e=>{
      e.preventDefault();e.stopPropagation();pathInput.classList.remove('drag')
    }))
    pathInput.addEventListener('drop',e=>{
      try{
        const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]
        if(f&&f.path){
          pathInput.value=f.path
          if(!nameInput.value.trim())nameInput.value=baseName(f.path)
        }else{
          showMsg('파일 경로를 읽지 못했어요',true)
        }
      }catch(err){
        console.error('[WCW] 드래그 앤 드롭 처리 실패:',err)
        showMsg('파일 정보를 읽지 못했어요',true)
      }
    })
  }

  render()
}

function initTimer(w){
  let mode='timer',run=false,ms=0,tms=0,iv=null
  const dp=w.querySelector('.tdisp'),st=w.querySelector('.tstart'),rs=w.querySelector('.treset')
  const tm=w.querySelector('.tmr'),sw=w.querySelector('.tsw'),hn=w.querySelector('.thint')
  function fmt(v){
    const t=Math.floor(Math.abs(v)/10),h=Math.floor(t/360000),m=Math.floor((t%360000)/6000),s=Math.floor((t%6000)/100),c=t%100
    const M=String(m).padStart(2,'0'),S=String(s).padStart(2,'0'),C=String(c).padStart(2,'0')
    return h>0?String(h).padStart(2,'0')+':'+M+':'+S+'.'+C:M+':'+S+'.'+C
  }
  function upd(){dp.textContent=mode==='timer'?fmt(Math.max(0,tms-ms)):fmt(ms)}
  dp.addEventListener('click',e=>{
    e.stopPropagation();if(run)return
    dp.setAttribute('contenteditable','true');dp.focus()
    if(hn)hn.textContent='Enter로 확정 (MM:SS)'
    const sel=window.getSelection(),rg=document.createRange()
    rg.selectNodeContents(dp);sel.removeAllRanges();sel.addRange(rg)
  })
  dp.addEventListener('keydown',e=>{
    e.stopPropagation()
    if(e.key==='Enter'){
      e.preventDefault()
      const p=dp.textContent.trim().replace(/\.\d+$/,'').split(':').map(Number)
      let s=0
      if(p.length===2)s=p[0]*60+p[1]
      else if(p.length===3)s=p[0]*3600+p[1]*60+p[2]
      if(!isNaN(s)&&s>0){tms=s*1000;ms=0}
      dp.removeAttribute('contenteditable')
      if(hn)hn.textContent='클릭해서 시간 입력'
      upd()
    }
    if(e.key==='Escape'){dp.removeAttribute('contenteditable');if(hn)hn.textContent='클릭해서 시간 입력';upd()}
  })
  dp.addEventListener('mousedown',e=>e.stopPropagation())
  tm.addEventListener('click',e=>{e.stopPropagation();mode='timer';ms=0;run=false;clearInterval(iv);st.textContent='시작';tm.classList.add('active');sw.classList.remove('active');dp.style.color='';upd()})
  sw.addEventListener('click',e=>{e.stopPropagation();mode='stopwatch';ms=0;run=false;clearInterval(iv);st.textContent='시작';sw.classList.add('active');tm.classList.remove('active');dp.style.color='';upd()})
  st.addEventListener('click',e=>{
    e.stopPropagation()
    if(mode==='timer'&&tms===0)return
    run=!run;st.textContent=run?'일시정지':'재개'
    if(run)iv=setInterval(()=>{ms+=10;if(mode==='timer'&&ms>=tms){clearInterval(iv);run=false;st.textContent='시작';dp.style.color='var(--dg)';setTimeout(()=>dp.style.color='',3000)}upd()},10)
    else clearInterval(iv)
  })
  rs.addEventListener('click',e=>{e.stopPropagation();run=false;clearInterval(iv);ms=0;st.textContent='시작';dp.style.color='';upd()})
  w.querySelectorAll('.tpre').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();const m=parseInt(b.textContent);tms=m*60*1000;ms=0;run=false;clearInterval(iv)
    st.textContent='시작';dp.style.color='';mode='timer';tm.classList.add('active');sw.classList.remove('active');upd()
  }))
  upd()
}

function initPomodoro(w){
  const K='wcw-pomo'
  let phase='work',run=false,sec=25*60,iv=null
  let count=parseInt(localStorage.getItem(K)||'0')
  const dp=w.querySelector('.tdisp'),ph=w.querySelector('.pomo-phase'),cn=w.querySelector('.pomo-count')
  const st=w.querySelector('.pstart'),rs=w.querySelector('.preset'),sk=w.querySelector('.pskip')
  const D={work:25*60,short:5*60,long:15*60}
  const N={work:'집중',short:'짧은 휴식',long:'긴 휴식'}
  function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
  function upd(){
    dp.textContent=fmt(sec)
    ph.textContent=N[phase]
    ph.style.color=phase==='work'?'var(--ac)':'var(--a2)'
    cn.textContent='완료 '+count
  }
  function next(){
    clearInterval(iv);run=false;st.textContent='시작'
    if(phase==='work'){
      count++;localStorage.setItem(K,count)
      phase=count%4===0?'long':'short'
    }else phase='work'
    sec=D[phase];upd()
    dp.style.color='var(--dg)';setTimeout(()=>dp.style.color='',2000)
  }
  st.addEventListener('click',e=>{
    e.stopPropagation()
    run=!run;st.textContent=run?'일시정지':'재개'
    if(run)iv=setInterval(()=>{sec--;if(sec<=0)next();else upd()},1000)
    else clearInterval(iv)
  })
  rs.addEventListener('click',e=>{e.stopPropagation();clearInterval(iv);run=false;st.textContent='시작';phase='work';sec=D.work;upd()})
  sk.addEventListener('click',e=>{e.stopPropagation();next()})
  upd()
}

function initCalc(w){
  let ex='',rs='0'
  const ee=w.querySelector('.calc-expr'),re=w.querySelector('.calc-res')
  function upd(){ee.textContent=ex;re.textContent=rs}
  function calc(s){
    const c=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-')
    if(!/^[\d+\-*/.() ]+$/.test(c))throw new Error('bad')
    return Function('"use strict";return('+c+')')()
  }
  w.querySelectorAll('.cbtn2').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();const t=b.textContent
    if(t==='C'){ex='';rs='0'}
    else if(t==='='){try{rs=String(calc(ex));ex=rs}catch(err){rs='오류';ex=''}}
    else if(t==='±'){try{rs=String(-parseFloat(rs));ex=rs}catch(err){}}
    else if(t==='%'){try{rs=String(parseFloat(rs)/100);ex=rs}catch(err){}}
    else{
      if(['÷','×','−','+'].indexOf(t)>=0){if(ex===''&&rs!=='0')ex=rs;ex+=t}
      else ex+=t
      try{const r=calc(ex);if(!isNaN(r)&&isFinite(r))rs=String(r)}catch(err){}
    }
    upd()
  }))
}

function initConvert(w){
  let cat='length'
  const inp=w.querySelector('.cvt-in'),out=w.querySelector('.cvt-out')
  const fs=w.querySelector('.cvt-from'),ts=w.querySelector('.cvt-to'),sw=w.querySelector('.cvt-swap')
  function fillSel(){

    Object.keys(u).forEach(k=>{
      const o1=document.createElement('option');o1.value=k;o1.textContent=n[k];fs.appendChild(o1)
      const o2=document.createElement('option');o2.value=k;o2.textContent=n[k];ts.appendChild(o2)
    })
    const ks=Object.keys(u)
    fs.value=ks[0];ts.value=ks[1]||ks[0]
  }
  function conv(){
    const v=parseFloat(inp.value)
    if(isNaN(v)){out.value='';return}
    const f=fs.value,t=ts.value
    if(cat==='temp'){
      let c
      if(f==='C')c=v
      else if(f==='F')c=(v-32)*5/9
      else c=v-273.15
      let r
      if(t==='C')r=c
      else if(t==='F')r=c*9/5+32
      else r=c+273.15
      out.value=r.toFixed(2)
    }else{
      const u=CVT[cat].units
      out.value=(v*u[f]/u[t]).toLocaleString('ko-KR',{maximumFractionDigits:6})
    }
  }
  w.querySelectorAll('.cvt-cbtn').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation()
    w.querySelectorAll('.cvt-cbtn').forEach(x=>x.classList.remove('active'))
    b.classList.add('active');cat=b.dataset.cat;fillSel();conv()
  }))
  ;[inp,fs,ts].forEach(el=>{
    el.addEventListener('mousedown',e=>e.stopPropagation())
    el.addEventListener('input',conv)
    el.addEventListener('change',conv)
  })
  sw.addEventListener('click',e=>{e.stopPropagation();const t=fs.value;fs.value=ts.value;ts.value=t;conv()})
  fillSel();conv()
}

function initDday(w){

  const list=w.querySelector('.dday-list'),ni=w.querySelector('.dday-ni'),di=w.querySelector('.dday-di'),ab=w.querySelector('.dday-ab')

    list.innerHTML=''

    dd.forEach((d,i)=>{
      const parts=d.date.split('-').map(Number)
      const target=new Date(parts[0],parts[1]-1,parts[2])

      rr.appendChild(cn);rr.appendChild(dl)

  render()
  // 1분마다 확인해서 날짜가 바뀌면 즉시 재계산
  let lastDay=new Date().getDate()
  regTimer(w,setInterval(()=>{
    const nowDay=new Date().getDate()
    if(nowDay!==lastDay){lastDay=nowDay;render()}
  },60*1000))
}

function initColorpick(w){
  const pv=w.querySelector('.cp-preview'),hex=w.querySelector('.cp-hex')
  const R=w.querySelector('.cp-r'),G=w.querySelector('.cp-g'),B=w.querySelector('.cp-b')
  const RV=w.querySelector('.cp-rv'),GV=w.querySelector('.cp-gv'),BV=w.querySelector('.cp-bv')
  const cpHex=w.querySelector('.cp-copy'),cpRgb=w.querySelector('.cp-copy-rgb')
  function toHex(n){return Number(n).toString(16).padStart(2,'0').toUpperCase()}
  function upd(){
    const r=+R.value,g=+G.value,b=+B.value
    RV.textContent=r;GV.textContent=g;BV.textContent=b
    R.style.background='linear-gradient(90deg,rgb(0,'+g+','+b+'),rgb(255,'+g+','+b+'))'
    G.style.background='linear-gradient(90deg,rgb('+r+',0,'+b+'),rgb('+r+',255,'+b+'))'
    B.style.background='linear-gradient(90deg,rgb('+r+','+g+',0),rgb('+r+','+g+',255))'
    const h='#'+toHex(r)+toHex(g)+toHex(b)
    pv.style.background=h
    if(document.activeElement!==hex)hex.value=h
  }
  ;[R,G,B].forEach(s=>{
    s.addEventListener('mousedown',e=>e.stopPropagation())
    s.addEventListener('input',upd)
  })
  hex.addEventListener('mousedown',e=>e.stopPropagation())
  hex.addEventListener('input',()=>{
    const v=hex.value.replace('#','').trim()
    if(/^[0-9a-fA-F]{6}$/.test(v)){
      R.value=parseInt(v.substr(0,2),16)
      G.value=parseInt(v.substr(2,2),16)
      B.value=parseInt(v.substr(4,2),16)
      upd()
    }
  })
  function flash(btn,orig){btn.innerHTML=icHTML('i-check')+'복사됨';setTimeout(()=>{btn.innerHTML=icHTML('i-copy')+orig},1200)}
  cpHex.addEventListener('click',e=>{
    e.stopPropagation()
    navigator.clipboard.writeText(hex.value).then(()=>flash(cpHex,'HEX 복사')).catch(()=>{})
  })
  cpRgb.addEventListener('click',e=>{
    e.stopPropagation()
    const s='rgb('+R.value+', '+G.value+', '+B.value+')'
    navigator.clipboard.writeText(s).then(()=>flash(cpRgb,'RGB 복사')).catch(()=>{})
  })
  upd()
}

function initChart(w){
  const K='wcw-chart-'+w.id
  const cv=w.querySelector('.chart-canvas'),list=w.querySelector('.chart-list')
  const li=w.querySelector('.chart-lbl'),vi=w.querySelector('.chart-val'),bt=w.querySelector('.chart-btn')
  let data=[]
  try{data=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){data=[]}
  function sv(){localStorage.setItem(K,JSON.stringify(data))}
  function draw(){
    const cw=cv.clientWidth,ch=cv.clientHeight
    if(cw<20||ch<20)return
    cv.width=cw;cv.height=ch
    const c=cv.getContext('2d')
    const st=getComputedStyle(document.body)
    const ac=st.getPropertyValue('--ac').trim()||'#4f8ef7'
    const sc=st.getPropertyValue('--sc').trim()||'rgba(255,255,255,.5)'
    c.clearRect(0,0,cw,ch)
    if(!data.length){
      c.fillStyle=sc;c.font='11px sans-serif';c.textAlign='center';c.textBaseline='middle'
      c.fillText('데이터를 추가해봐',cw/2,ch/2);return
    }
    const max=Math.max.apply(null,data.map(d=>d.v))||1
    const pad=18,bw=(cw-pad*2)/data.length
    data.forEach((d,i)=>{
      const bh=(d.v/max)*(ch-30)
      const x=pad+i*bw+bw*0.15,y=ch-20-bh,ww=bw*0.7
      c.fillStyle=ac;c.globalAlpha=.85
      c.fillRect(x,y,ww,bh)
      c.globalAlpha=1
      c.fillStyle=sc;c.font='9px sans-serif';c.textAlign='center'
      c.fillText(d.l.length>5?d.l.substr(0,5):d.l,x+ww/2,ch-7)
      c.fillText(d.v,x+ww/2,y-3)
    })
  }
  function render(){
    list.innerHTML=''
    data.forEach((d,i)=>{
      const it=document.createElement('div');it.className='chart-item'
      const s=document.createElement('span');s.textContent=d.l+': '+d.v
      const b=document.createElement('button');b.className='chart-del';b.appendChild(svgIc('i-x'))
      b.addEventListener('click',e=>{e.stopPropagation();data.splice(i,1);sv();render()})
      it.appendChild(s);it.appendChild(b);list.appendChild(it)
    })
    draw()
  }
  function add(){
    const l=li.value.trim(),v=parseFloat(vi.value)
    if(!l||isNaN(v))return
    data.push({l:l,v:v});sv();render();li.value='';vi.value=''
  }
  bt.addEventListener('click',e=>{e.stopPropagation();add()})
  ;[li,vi].forEach(el=>{
    el.addEventListener('mousedown',e=>e.stopPropagation())
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.stopPropagation();e.preventDefault();add()}})
  })
  w._redraw=draw
  render()
}

function initSnake(w){
  const K='wcw-snake-best'
  const cv=w.querySelector('.snake-canvas'),bt=w.querySelector('.snake-btn')
  const sc=w.querySelector('.snake-score'),bs=w.querySelector('.snake-best')
  let best=parseInt(localStorage.getItem(K)||'0')
  bs.textContent='최고 '+best
  const G=15
  let snake=[],food={x:5,y:5},dir={x:1,y:0},nd={x:1,y:0},score=0,run=false,loop=null
  function reset(){
    snake=[{x:7,y:7},{x:6,y:7},{x:5,y:7}]
    dir={x:1,y:0};nd={x:1,y:0};score=0
    placeFood();sc.textContent='점수 0'
  }
  function placeFood(){
    let ok=false
    while(!ok){
      food={x:Math.floor(Math.random()*G),y:Math.floor(Math.random()*G)}
      ok=!snake.some(s=>s.x===food.x&&s.y===food.y)
    }
  }
  function draw(){
    const cw=cv.clientWidth,ch=cv.clientHeight
    if(cw<20||ch<20)return
    cv.width=cw;cv.height=ch
    const c=cv.getContext('2d')
    const st=getComputedStyle(document.body)
    const ac=st.getPropertyValue('--ac').trim()||'#4f8ef7'
    const dg=st.getPropertyValue('--dg').trim()||'#f87171'
    const size=Math.min(cw,ch)/G
    const ox=(cw-size*G)/2,oy=(ch-size*G)/2
    c.clearRect(0,0,cw,ch)
    c.fillStyle=dg
    c.fillRect(ox+food.x*size+1,oy+food.y*size+1,size-2,size-2)
    snake.forEach((s,i)=>{
      c.fillStyle=ac
      c.globalAlpha=i===0?1:0.75
      c.fillRect(ox+s.x*size+1,oy+s.y*size+1,size-2,size-2)
    })
    c.globalAlpha=1
  }
  function step(){
    dir=nd
    const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y}
    if(h.x<0||h.x>=G||h.y<0||h.y>=G||snake.some(s=>s.x===h.x&&s.y===h.y)){
      run=false;clearInterval(loop);bt.textContent='다시 시작'
      if(score>best){best=score;localStorage.setItem(K,best);bs.textContent='최고 '+best}
      return
    }
    snake.unshift(h)
    if(h.x===food.x&&h.y===food.y){score+=10;sc.textContent='점수 '+score;placeFood()}
    else snake.pop()
    draw()
  }
  function keyHandler(e){
    if(!run)return
    const k=e.key
    if(k==='ArrowUp'&&dir.y===0)nd={x:0,y:-1}
    else if(k==='ArrowDown'&&dir.y===0)nd={x:0,y:1}
    else if(k==='ArrowLeft'&&dir.x===0)nd={x:-1,y:0}
    else if(k==='ArrowRight'&&dir.x===0)nd={x:1,y:0}
    else return
    e.preventDefault()
  }
  document.addEventListener('keydown',keyHandler)
  w._cleanup=()=>{clearInterval(loop);document.removeEventListener('keydown',keyHandler)}
  bt.addEventListener('click',e=>{
    e.stopPropagation()
    if(run){run=false;clearInterval(loop);bt.textContent='다시 시작';return}
    reset();run=true;bt.textContent='정지'
    clearInterval(loop);loop=setInterval(step,150)
    draw()
  })
  w._redraw=draw
  reset();draw()
}

function spDateKey(d){
  const x=new Date(d);x.setHours(0,0,0,0)
  return x.toISOString().slice(0,10).replace(/-/g,'')
}
function spRange(daysBack,daysForward){
  const a=new Date();a.setHours(0,0,0,0);a.setDate(a.getDate()-daysBack)
  const b=new Date();b.setHours(0,0,0,0);b.setDate(b.getDate()+daysForward)
  return spDateKey(a)+'-'+spDateKey(b)
}
function spGoogle(q){
  return 'https://www.google.com/search?hl=ko&gl=KR&q='+encodeURIComponent(q)
}
function spGoogleGame(g){
  const dt=g.date?new Date(g.date):null
  const dateText=dt&&!isNaN(dt)
    ? dt.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'})
    : ''
  const league=g.league||g.leagueName||''
  // 팀명/리그/날짜를 모두 넣어 Google이 경기 자체를 찾도록 한다.
  const q=['"'+(g.home||'')+'"','"'+(g.away||'')+'"',league,dateText,'경기 일정']
    .filter(Boolean).join(' ')
  return spGoogle(q)
}

function parseESPN(data){
  try{
    if(!data||!Array.isArray(data.events))return[]
    return data.events.map(ev=>{
      const comp=ev.competitions&&ev.competitions[0];if(!comp)return null
      const home=comp.competitors?.find(t=>t.homeAway==='home')
      const away=comp.competitors?.find(t=>t.homeAway==='away')
      if(!home||!away)return null
      const st=ev.status?.type||{}
      const live=st.state==='in'||/live|in progress/i.test(st.description||'')
      const done=!!st.completed
      const dt=ev.date?new Date(ev.date):null
      let stTxt='예정'
      if(done)stTxt='종료'
      else if(live)stTxt='● 진행중 '+(ev.status.displayClock||'')
      else if(dt&&!isNaN(dt))stTxt=dt.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})+' '+dt.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})
      const info=t=>({
        name:t.team?.shortDisplayName||t.team?.displayName||t.team?.name||'?',
        logo:t.team?.logo||t.team?.logos?.[0]?.href||'',
        abbr:t.team?.abbreviation||'?',
        rec:t.records?.[0]?.summary||''
      })
      const h=info(home),a=info(away)
      return {home:h.name,away:a.name,homeLogo:h.logo,awayLogo:a.logo,homeAbbr:h.abbr,awayAbbr:a.abbr,homeRec:h.rec,awayRec:a.rec,hs:home.score!=null?home.score:null,as:away.score!=null?away.score:null,live,done,stTxt,date:dt&&!isNaN(dt)?dt.toISOString():'',league:ev.league?.name||'',link:spGoogleGame({home:h.name,away:a.name,date:dt&&!isNaN(dt)?dt.toISOString():'',league:ev.league?.name||''})}
    }).filter(Boolean)
  }catch(e){return[]}
}

async function fetchESPNRange(conf){
  // 현재 진행중/최근 경기 + 앞으로의 일정까지 넓게 수집한다.
  // NBA는 시즌 전에도 개막 일정이 잡히도록 180일 범위를 우선 사용한다.
  const forward=conf.id==='nba' ? 180 : 60
  const ranges=[
    spRange(3,forward),
    spRange(14,30),
    spRange(3,7)
  ]
  const all=[]
  const seen=new Set()

  for(const range of ranges){
    const url=conf.api+'?dates='+range+'&limit=1000'
    try{
      const raw=await ipcRenderer.invoke('fetch-url',url)
      if(!raw)continue
      const games=parseESPN(JSON.parse(raw))
      for(const g of games){
        const key=(g.home||'')+'|'+(g.away||'')+'|'+(g.date||'')
        if(!seen.has(key)){seen.add(key);all.push(g)}
      }
    }catch(e){}
  }
  return all
}

function spRenderGame(it,g){
  it.className='sp-item big'
  const row=document.createElement('div');row.className='sp-big-row'
  function side(name,logo,abbr,rec){
    const sd=document.createElement('div');sd.className='sp-side'
    if(logo){const img=document.createElement('img');img.className='sp-logo';img.src=logo;img.alt=abbr;img.onerror=function(){const fb=document.createElement('div');fb.className='sp-logo-fb';fb.textContent=abbr;this.replaceWith(fb)};sd.appendChild(img)}
    else{const fb=document.createElement('div');fb.className='sp-logo-fb';fb.textContent=abbr;sd.appendChild(fb)}
    const nm=document.createElement('div');nm.className='sp-tname';nm.textContent=name;sd.appendChild(nm)
    if(rec){const rc=document.createElement('div');rc.className='sp-record';rc.textContent=rec;sd.appendChild(rc)}
    return sd
  }
  row.appendChild(side(g.home,g.homeLogo,g.homeAbbr,g.homeRec))
  const ctr=document.createElement('div');ctr.className='sp-center'
  const sc=document.createElement('div');sc.className=(g.hs!==null&&g.as!==null)?('sp-bigscore'+(g.live?' live':'')):'sp-vs';sc.textContent=(g.hs!==null&&g.as!==null)?g.hs+' - '+g.as:'VS';ctr.appendChild(sc)
  const mt=document.createElement('div');mt.className='sp-bigmeta'+(g.live?' live':'');mt.textContent=g.stTxt;ctr.appendChild(mt);row.appendChild(ctr)
  row.appendChild(side(g.away,g.awayLogo,g.awayAbbr,g.awayRec));it.appendChild(row)
  if(g.hs!==null&&g.as!==null){const h=parseInt(g.hs)||0,a=parseInt(g.as)||0,tot=h+a;const bw=document.createElement('div');bw.className='sp-bar-wrap';const bh=document.createElement('div');bh.className='sp-bar-h';const ba=document.createElement('div');ba.className='sp-bar-a';bh.style.width=(tot?h/tot*100:50)+'%';ba.style.width=(tot?a/tot*100:50)+'%';bw.append(bh,ba);it.appendChild(bw)}
  it.addEventListener('click',e=>{e.stopPropagation();shell.openExternal(spGoogleGame(g))})
}

function initSports(w){
  const tabs=w.querySelector('.sp-tabs'),list=w.querySelector('.sp-list'),upd=w.querySelector('.sp-updated')
  let cur=localStorage.getItem('wcw-sports-league')||'nba',loading=false
  if(!SPORTS_LIST.some(x=>x.id===cur))cur='nba'

  SPORTS_LIST.forEach(sp=>{
    const b=document.createElement('button')
    b.className='sp-tab'+(sp.id===cur?' active':'')
    b.textContent=sp.name
    b.addEventListener('click',e=>{
      e.stopPropagation()
      cur=sp.id
      localStorage.setItem('wcw-sports-league',cur)
      tabs.querySelectorAll('.sp-tab').forEach(x=>x.classList.remove('active'))
      b.classList.add('active')
      load()
    })
    tabs.appendChild(b)
  })

  async function load(){
    if(loading)return
    loading=true
    list.innerHTML='<div class="sp-err">진행중인 경기와 전체 일정을 많이 불러오는 중...</div>'

    try{
      const conf=SPORTS_LIST.find(x=>x.id===cur)
      let games=await fetchESPNRange(conf)

      const now=Date.now()
      games=games.filter(g=>g && g.date)

      // 중복 제거
      const seen=new Set()
      games=games.filter(g=>{
        const key=(g.home||'')+'|'+(g.away||'')+'|'+g.date
        if(seen.has(key))return false
        seen.add(key)
        return true
      })

      const live=games
        .filter(g=>g.live)
        .sort((a,b)=>new Date(a.date)-new Date(b.date))

      const upcoming=games
        .filter(g=>!g.live && !g.done && new Date(g.date).getTime()>=now)
        .sort((a,b)=>new Date(a.date)-new Date(b.date))

      // 종료 경기는 최근 2개만, 예정 경기는 넉넉하게 보여준다.
      const doneLimit=2
      const futureLimit=20

      const recent=games
        .filter(g=>g.done && new Date(g.date).getTime()<=now)
        .sort((a,b)=>new Date(b.date)-new Date(a.date))
        .slice(0,doneLimit)

      // 표시 순서: 종료된 경기 → 진행중인 경기 → 예정 경기
      const final=[...recent,...live,...upcoming.slice(0,futureLimit)]

      // 같은 경기가 섞이는 경우 최종 중복 제거
      const finalSeen=new Set()
      const uniqueFinal=final.filter(g=>{
        const key=(g.home||'')+'|'+(g.away||'')+'|'+g.date
        if(finalSeen.has(key))return false
        finalSeen.add(key)
        return true
      })

      list.innerHTML=''

      if(!uniqueFinal.length){
        const e=document.createElement('div')
        e.className='sp-err'
        e.textContent='현재 표시할 경기가 없습니다.\nGoogle에서 전체 일정을 확인할 수 있어요.'
        list.appendChild(e)

        const b=document.createElement('button')
        b.className='gcal-btn'
        b.textContent='Google에서 일정 검색'
        b.addEventListener('click',e=>{
          e.stopPropagation()
          shell.openExternal(spGoogle(conf.search))
        })
        list.appendChild(b)
      }else{
        uniqueFinal.forEach(g=>{
          const it=document.createElement('div')
          spRenderGame(it,g)
          list.appendChild(it)
        })
      }

      const timeTxt=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})
      upd.textContent = '업데이트: '+timeTxt
    }catch(e){
      list.innerHTML=''
      const el=document.createElement('div')
      el.className='sp-err'
      el.textContent='경기 데이터를 불러오지 못했습니다.\n네트워크를 확인하고 다시 시도해주세요.'
      list.appendChild(el)

      const b=document.createElement('button')
      b.className='gcal-btn'
      b.textContent='다시 시도'
      b.addEventListener('click',e=>{e.stopPropagation();load()})
      list.appendChild(b)
    }

    loading=false
  }

  load()
  // 진행중인 경기의 점수가 빠르게 반영되도록 30초마다 새로고침한다.
  regTimer(w,setInterval(load,30*1000))
}
