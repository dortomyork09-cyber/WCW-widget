<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>WCW</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --n0:#050a14; --n1:#07101f; --n2:#0a1628; --n3:#0f1e38;
  --c1:#1e3a8a; --c2:#1d4ed8; --c3:#2563eb; --c4:#3b82f6;
  --c5:#60a5fa; --c6:#93c5fd; --c7:#bfdbfe; --c8:#dbeafe;
  /* 위젯 배경 — 반투명 다크 블루 (기존 스타일) */
  --wb:rgba(10,18,40,.85);
  --wbr:rgba(59,130,246,.25);
  --wc:#e8f0ff; --lc:#60a5fa; --sc:#93c5fd;
  --ac:#3b82f6; --a2:#60a5fa; --dg:#f87171;
  --bg:rgba(30,58,138,.25); --ib:rgba(5,10,20,.5); --ibr:rgba(59,130,246,.18);
  --wr:15px; --wf:'Inter',-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --sh:0 8px 32px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3);
}
body.theme-dark{--wb:rgba(8,14,32,.88);--wbr:rgba(59,130,246,.22);--n0:#030711;--n1:#060d1c;--n2:#09132a;--n3:#0d1b38;--wc:#dbeafe;--lc:#60a5fa;--sc:#93c5fd;--ac:#3b82f6;--bg:rgba(30,58,138,.2);--ib:rgba(3,7,17,.55);--ibr:rgba(59,130,246,.15)}
body.theme-light{--n0:#f0f6ff;--n1:#e2edfd;--n2:#fff;--n3:#dbeafe;--wb:rgba(255,255,255,.88);--wbr:rgba(59,130,246,.3);--wc:#0f2557;--lc:#2563eb;--sc:#1d4ed8;--ac:#2563eb;--a2:#3b82f6;--bg:rgba(219,234,254,.6);--ib:rgba(255,255,255,.7);--ibr:rgba(147,197,253,.4);--sh:0 8px 32px rgba(30,58,138,.12)}
body.theme-neon{--n0:#000510;--n1:#000a1f;--n2:#00102e;--n3:#001440;--wb:rgba(0,8,30,.88);--wbr:rgba(0,153,255,.4);--wc:#ccf0ff;--lc:#0099ff;--sc:#00ccff;--ac:#0099ff;--a2:#00ccff;--bg:rgba(0,100,200,.2);--ib:rgba(0,4,15,.6);--ibr:rgba(0,153,255,.25);--sh:0 0 20px rgba(0,153,255,.25)}
body.theme-ocean{--n0:#000d1a;--n1:#001533;--n2:#001f4d;--n3:#002866;--wb:rgba(0,15,45,.87);--wbr:rgba(0,180,220,.3);--wc:#caf0f8;--lc:#00b4d8;--sc:#90e0ef;--ac:#0096c7;--a2:#48cae4;--bg:rgba(0,100,150,.25);--ib:rgba(0,8,20,.55);--ibr:rgba(0,150,200,.2)}
body.theme-sunset{--n0:#1a0a00;--n1:#2a1200;--n2:#3d1a00;--n3:#502300;--wb:rgba(40,18,5,.88);--wbr:rgba(251,146,60,.3);--wc:#fff7ed;--lc:#fb923c;--sc:#fdba74;--ac:#f97316;--a2:#fb923c;--bg:rgba(120,53,15,.25);--ib:rgba(20,9,0,.55);--ibr:rgba(251,146,60,.2)}
body.theme-forest{--n0:#051008;--n1:#07180a;--n2:#0a2010;--n3:#0e2b15;--wb:rgba(7,20,10,.87);--wbr:rgba(74,222,128,.25);--wc:#d4f5d8;--lc:#4ade80;--sc:#86efac;--ac:#22c55e;--a2:#4ade80;--bg:rgba(20,80,40,.25);--ib:rgba(4,12,6,.55);--ibr:rgba(74,222,128,.18)}
body.theme-aurora{--n0:#050514;--n1:#080820;--n2:#0c0c30;--n3:#10103f;--wb:rgba(8,8,28,.88);--wbr:rgba(167,139,250,.3);--wc:#ede9fe;--lc:#a78bfa;--sc:#c4b5fd;--ac:#8b5cf6;--a2:#a78bfa;--bg:rgba(76,29,149,.22);--ib:rgba(5,4,16,.6);--ibr:rgba(167,139,250,.2)}
body.theme-cherry{--n0:#150508;--n1:#200810;--n2:#2e0c18;--n3:#3d1020;--wb:rgba(28,8,16,.88);--wbr:rgba(251,113,133,.28);--wc:#ffe4e6;--lc:#fb7185;--sc:#fda4af;--ac:#f43f5e;--a2:#fb7185;--bg:rgba(136,19,55,.22);--ib:rgba(14,5,9,.58);--ibr:rgba(251,113,133,.2)}
body.theme-mono{--n0:#050505;--n1:#0d0d0d;--n2:#161616;--n3:#202020;--wb:rgba(16,16,16,.88);--wbr:rgba(200,200,200,.2);--wc:#f5f5f5;--lc:#888;--sc:#aaa;--ac:#fff;--a2:#ccc;--bg:rgba(50,50,50,.3);--ib:rgba(0,0,0,.5);--ibr:rgba(150,150,150,.15);--wr:4px}

html,body{background:transparent !important;background-color:transparent !important;}
body{
  background:transparent !important;color:var(--wc);font-family:var(--wf);
  width:100vw;height:100vh;overflow:hidden;position:relative;
  -webkit-font-smoothing:antialiased;
}
body::before{display:none !important;content:none !important;}

/* ══ 위젯 ══ */
.widget{
  position:absolute;background:var(--wb);
  border:1px solid var(--wbr);border-radius:var(--wr);
  padding:13px;color:var(--wc);font-family:var(--wf);
  backdrop-filter:blur(20px) saturate(1.2);
  -webkit-backdrop-filter:blur(20px) saturate(1.2);
  cursor:grab;min-width:160px;min-height:80px;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.06);
  transition:border-color .25s,box-shadow .25s;
}
.widget:hover{border-color:var(--c3);box-shadow:var(--sh),0 0 0 1px #2563eb33,inset 0 1px 0 #ffffff0d}
.widget:active{cursor:grabbing}
@keyframes widgetIn{
  0%{opacity:0;transform:scale(.85) translateY(10px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
.widget-enter{animation:widgetIn .3s cubic-bezier(.2,.85,.35,1.1)}
.wl{
  font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--lc);margin-bottom:9px;flex-shrink:0;
  display:flex;align-items:center;gap:6px;
}
.wl .ic{width:12px;height:12px;flex-shrink:0;opacity:.85}
.wc{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.rh{position:absolute;right:0;bottom:0;width:17px;height:17px;cursor:se-resize;z-index:10}
.rh::after{content:'';position:absolute;right:4px;bottom:4px;width:6px;height:6px;border-right:1.5px solid var(--c3);border-bottom:1.5px solid var(--c3);transition:border-color .2s}
.rh:hover::after{border-color:var(--c5)}

/* ══ 위젯 "핀" 장식 — 그냥 색만 다른 네모가 아니라 코르크보드에 압정으로 꽂아둔 느낌을 준다 ══
   (.widget에 overflow:hidden이 걸려있어 테두리 밖으로 튀어나오면 잘리므로 안쪽 여백에 배치) */
.widget::before{
  content:'';
  position:absolute;
  top:3px;left:11px;
  width:8px;height:8px;
  border-radius:50%;
  background:radial-gradient(circle at 32% 28%,var(--c7),var(--c3) 62%,var(--c1) 100%);
  box-shadow:0 2px 4px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.55);
  z-index:2;
  pointer-events:none;
  transition:transform .2s;
}
.widget:hover::before{transform:scale(1.15)}
body.theme-mono .widget::before{background:radial-gradient(circle at 32% 28%,#fff,#aaa 62%,#555 100%)}

/* ══ 테마 마스코트 — 색만 바뀌는 게 아니라 테마마다 표정+장식이 있는 캐릭터를 하나 둔다 ══ */
.mascot{
  position:fixed;right:26px;bottom:26px;
  width:64px;height:64px;
  pointer-events:none;z-index:5;opacity:.92;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));
  animation:mascotBob 4.5s ease-in-out infinite;
}
.mascot svg{width:100%;height:100%;display:block}
@keyframes mascotBob{
  0%,100%{transform:translateY(0) rotate(-1.5deg)}
  50%{transform:translateY(-7px) rotate(1.5deg)}
}

/* ══ 아이콘 시스템 ══ */
.ic{display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.wl .ic{color:var(--ac)}

/* ══ 탑바 ══ */
.topbar{
  position:fixed;top:0;left:0;right:0;height:46px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;z-index:9000;
  background:transparent !important;
}
.brand{display:flex;align-items:center;gap:9px}
.brand-mk{
  width:22px;height:22px;border-radius:6px;
  background:linear-gradient(135deg,var(--c4),var(--c2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px #2563eb50;
}
.brand-mk svg{width:12px;height:12px;stroke:#fff;stroke-width:2.4}
.brand-tx{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--c6)}
.topbar-r{display:flex;gap:7px}

/* ══ 버튼 ══ */
.btn{
  height:29px;padding:0 12px;background:#0b183099;
  border:1px solid var(--wbr);border-radius:8px;color:var(--sc);
  font-size:11.5px;font-weight:500;font-family:var(--wf);cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:all .15s;
  white-space:nowrap;backdrop-filter:blur(12px);
}
body.theme-light .btn,body.theme-ice .btn{background:#ffffffaa}
.btn:hover{background:var(--n3);border-color:var(--c3);color:var(--wc)}
.btn .ic{width:13px;height:13px}
.btn.pri{background:var(--c3);border-color:var(--c3);color:#fff}
.btn.pri:hover{background:var(--c2);border-color:var(--c2)}
.btn.dgr:hover{background:#7f1d1d33;border-color:#ef444466;color:#f87171}

/* ══ 패널 ══ */
.pnl{
  position:fixed;background:var(--wb);border:1px solid var(--wbr);
  border-radius:14px;padding:18px;z-index:10000;display:none;
  backdrop-filter:blur(28px) saturate(1.3);box-shadow:0 24px 70px #00000090;
}
.pnl.show{display:block}
.pnl-t{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--lc);margin-bottom:14px}
#theme-panel{top:52px;left:50%;transform:translateX(-50%)}
#settings-panel{top:52px;right:18px;min-width:262px}
.th-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.thb{border-radius:9px;border:1.5px solid transparent;padding:11px 5px 8px;cursor:pointer;text-align:center;transition:transform .15s,border-color .15s}
.thb:hover{transform:translateY(-2px)}
.thb.active{border-color:#fff}
.thb .sw{width:100%;height:16px;border-radius:4px;margin-bottom:6px}
.thb .nm{font-size:8.5px;font-weight:600;font-family:var(--wf);opacity:.8}

.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--ibr)}
.set-row:last-child{border:none;padding-bottom:0}
.set-l{font-size:12.5px;font-weight:500;color:var(--wc)}
.set-s{font-size:10px;color:var(--sc);margin-top:2px;opacity:.75}
.tog{position:relative;width:36px;height:19px;background:var(--bg);border:1px solid var(--ibr);border-radius:10px;cursor:pointer;transition:all .2s;flex-shrink:0}
.tog.on{background:var(--c3);border-color:var(--c3)}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on::after{transform:translateX(17px)}
.sld{width:92px;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:var(--bg);outline:none;cursor:pointer}
.sld::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:var(--c4);cursor:pointer;box-shadow:0 0 0 3px #3b82f628}
.set-v{font-size:11px;color:var(--sc);min-width:32px;text-align:right;font-family:var(--mono)}

/* ══ 모달 ══ */
.mov{position:fixed;inset:0;background:#020610cc;z-index:10000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.mov.show{display:flex}
.mdl{background:var(--wb);border:1px solid var(--wbr);border-radius:16px;padding:22px;min-width:420px;max-height:82vh;overflow-y:auto;box-shadow:0 30px 90px #000000a0;backdrop-filter:blur(28px)}
.mdl::-webkit-scrollbar{width:3px}
.mdl::-webkit-scrollbar-thumb{background:var(--c1);border-radius:2px}
.mdl-h{font-size:15px;font-weight:700;color:var(--wc);margin-bottom:3px}
.mdl-d{font-size:11px;color:var(--sc);margin-bottom:6px;opacity:.8}
.mdl-s{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lc);margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--ibr)}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wopt{background:#10234066;border:1px solid var(--ibr);border-radius:9px;padding:12px 6px;cursor:pointer;text-align:center;transition:all .15s}
body.theme-light .wopt,body.theme-ice .wopt{background:#ffffff80}
.wopt:hover{background:#2563eb1f;border-color:#2563eb80;transform:translateY(-2px)}
.wopt .ic{width:19px;height:19px;color:var(--c5);margin-bottom:6px}
.wopt .nm{font-size:9.5px;font-weight:600;color:var(--sc)}

/* ══ 컨텍스트 ══ */
.ctx{position:fixed;background:var(--wb);border:1px solid var(--wbr);border-radius:10px;padding:4px;z-index:99999;display:none;min-width:148px;box-shadow:0 10px 36px #00000080;backdrop-filter:blur(20px)}
.ctx.show{display:block}
.ctx-i{padding:8px 11px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--wc);display:flex;align-items:center;gap:9px;transition:background .12s}
.ctx-i:hover{background:var(--n3)}
.ctx-i.dgr:hover{background:#ef44441a;color:#f87171}
.ctx-i .ic{width:13px;height:13px}

/* ══ 색상 피커 ══ */
.cpick{position:fixed;background:var(--wb);border:1px solid var(--wbr);border-radius:10px;padding:8px;z-index:99999;display:none;gap:5px;flex-wrap:wrap;width:118px;backdrop-filter:blur(20px);box-shadow:0 10px 36px #00000080}
.cpick.show{display:flex}
.cdot{width:17px;height:17px;border-radius:5px;cursor:pointer;border:1.5px solid transparent;transition:transform .12s}
.cdot:hover{transform:scale(1.18)}

/* ══ 스크롤바 공통 ══ */
.scr::-webkit-scrollbar,.todo-list::-webkit-scrollbar,.news-list::-webkit-scrollbar,.links-list::-webkit-scrollbar,.habit-list::-webkit-scrollbar,.dday-list::-webkit-scrollbar,.sp-list::-webkit-scrollbar,.wc::-webkit-scrollbar,.chart-list::-webkit-scrollbar{width:3px;height:3px}
.scr::-webkit-scrollbar-thumb,.todo-list::-webkit-scrollbar-thumb,.news-list::-webkit-scrollbar-thumb,.links-list::-webkit-scrollbar-thumb,.habit-list::-webkit-scrollbar-thumb,.dday-list::-webkit-scrollbar-thumb,.sp-list::-webkit-scrollbar-thumb,.wc::-webkit-scrollbar-thumb,.chart-list::-webkit-scrollbar-thumb{background:var(--c1);border-radius:2px}

/* ══ 시계 ══ */
.clock-time{font-weight:600;line-height:1;white-space:nowrap;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock-date{color:var(--sc);margin-top:5px;white-space:nowrap;font-size:11px;opacity:.85}
.analog-wrap{display:none;align-items:center;justify-content:center;flex:1;padding:4px}
.analog-wrap.show{display:flex}
.clock-digital{display:flex;flex-direction:column;justify-content:center}

.npb{font-size:9px;color:var(--c4);margin-left:auto;font-weight:600;letter-spacing:.06em}

/* ══ 할일 ══ */
.todo-list{flex:1;overflow-y:auto;overflow-x:hidden}
.ti{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ibr)}
.ti:last-child{border:none}
.tcheck{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--c2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.tcheck.on{background:var(--c3);border-color:var(--c3)}
.tcheck .ic{width:10px;height:10px;color:#fff;stroke-width:3;opacity:0}
.tcheck.on .ic{opacity:1}
.tc{width:8px;height:8px;border-radius:3px;flex-shrink:0;cursor:pointer;border:1px solid var(--ibr)}
.tt{flex:1;outline:none;background:transparent;border:none;color:var(--wc);font-family:var(--wf);font-size:12.5px;cursor:text}
.tt.done{text-decoration:line-through;color:var(--sc);opacity:.6}
.tdel{background:transparent;border:none;color:var(--dg);cursor:pointer;padding:2px;opacity:0;flex-shrink:0;display:flex;transition:opacity .15s}
.tdel .ic{width:11px;height:11px}
.ti:hover .tdel{opacity:.7}
.tdel:hover{opacity:1!important}
.tinput{background:transparent;border:none;border-top:1px solid var(--ibr);color:var(--wc);font-family:var(--wf);font-size:12.5px;padding:8px 0 3px;outline:none;margin-top:4px;width:100%;flex-shrink:0}
.tinput::placeholder{color:var(--lc);opacity:.55}
.tcount{font-size:10px;color:var(--sc);margin-top:5px;flex-shrink:0;font-family:var(--mono);opacity:.75}

/* ══ 메모 ══ */
.memo-area{flex:1;width:100%;background:transparent;border:none;color:var(--wc);font-family:var(--wf);resize:none;outline:none;line-height:1.65;cursor:text;min-height:60px;font-size:12.5px}
.memo-area::placeholder{color:var(--lc);opacity:.45}

/* ══ 달력 ══ */
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;flex-shrink:0}
.cal-nav{background:#10234066;border:1px solid var(--ibr);color:var(--sc);cursor:pointer;padding:3px 7px;border-radius:5px;display:flex;align-items:center;transition:all .15s}
.cal-nav:hover{background:var(--n3);color:var(--wc)}
.cal-nav .ic{width:11px;height:11px}
.cal-mo{font-size:11.5px;color:var(--wc);font-weight:600;letter-spacing:-.01em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{text-align:center;color:var(--lc);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;font-family:var(--wf)}
.cal-cell{text-align:center;border-radius:5px;color:var(--sc);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;font-family:var(--mono);font-size:11px;transition:background .12s}
.cal-cell:hover{background:#2563eb26;color:var(--wc)}
.cal-cell.today{background:var(--c3);color:#fff;font-weight:600}
.cal-cell.other{opacity:.28}
.cal-cell.selected{box-shadow:inset 0 0 0 1.5px var(--c5)}
.cal-cell.has-memo::after{content:'';position:absolute;bottom:2px;width:3px;height:3px;border-radius:50%;background:var(--c5)}
.cal-dmemo{width:100%;margin-top:9px;flex-shrink:0;display:none;border-top:1px solid var(--ibr);padding-top:9px}
.cal-dmemo.show{display:block}
.cal-dmemo-title{font-size:10px;color:var(--lc);margin-bottom:5px;font-family:var(--mono)}
.cal-dmemo-text{width:100%;background:var(--ib);border:1px solid var(--ibr);border-radius:7px;color:var(--wc);font-family:var(--wf);font-size:11.5px;padding:7px 9px;outline:none;resize:none;min-height:56px}
.cal-dcols{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.cal-dcbtn{width:13px;height:13px;border-radius:4px;border:1.5px solid transparent;cursor:pointer;flex-shrink:0}
.cal-dcbtn.active{border-color:var(--wc)}

/* ══ 뉴스 ══ */
.news-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;flex-shrink:0}
.news-rbtn{background:#10234066;border:1px solid var(--ibr);border-radius:6px;color:var(--sc);cursor:pointer;padding:4px 9px;display:flex;align-items:center;gap:5px;font-size:10px;font-family:var(--wf);transition:all .15s}
.news-rbtn:hover{color:var(--wc);border-color:var(--c3)}
.news-rbtn .ic{width:11px;height:11px}
.news-rbtn.spin .ic{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.news-list{flex:1;overflow-y:auto}
.ni{padding:8px 0;border-bottom:1px solid var(--ibr);cursor:pointer;transition:padding-left .15s}
.ni:last-child{border:none}
.ni:hover{padding-left:4px}
.ni:hover .nt{color:var(--c5)}
.nt{font-size:11.5px;color:var(--wc);line-height:1.45;transition:color .15s}
.ns{font-size:9.5px;color:var(--sc);margin-top:3px;opacity:.75;font-family:var(--mono)}
.nst{font-size:11px;color:var(--sc);text-align:center;margin-top:10px;opacity:.7}

/* ══ 환율 · 주식 ══ */
.ri,.sti{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--ibr);cursor:pointer;transition:padding-left .15s}
.ri:last-child,.sti:last-child{border:none}
.ri:hover,.sti:hover{padding-left:3px}
.ri:hover .rl,.sti:hover .ssym{color:var(--c5)}
.rf{margin-right:5px}
.rl{font-size:11.5px;color:var(--sc);display:flex;align-items:center;transition:color .15s}
.rr,.str{text-align:right}
.rv,.sp{font-size:12.5px;font-weight:600;color:var(--wc);font-family:var(--mono);letter-spacing:-.02em}
.rch,.sc{font-size:9.5px;display:block;font-family:var(--mono);margin-top:1px}
.cup{color:#4ade80}
.cdn{color:#f87171}
.rup,.sup{font-size:9px;color:var(--sc);margin-top:6px;text-align:right;flex-shrink:0;opacity:.6;font-family:var(--mono)}
.stl{display:flex;flex-direction:column}
.ssym{font-size:12px;font-weight:600;color:var(--wc);transition:color .15s}
.sname{font-size:9px;color:var(--sc);opacity:.7;font-family:var(--mono);margin-top:1px}
.st-right{display:flex;align-items:center;gap:6px}
.st-del{background:transparent;border:none;color:var(--dg);cursor:pointer;opacity:0;flex-shrink:0;display:flex;transition:opacity .15s}
.st-del .ic{width:11px;height:11px}
.sti:hover .st-del{opacity:.7}
.stock-search-wrap{position:relative;flex-shrink:0;margin-bottom:8px}
.stock-search-in{margin:0}
.stock-search-results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--wb);border:1px solid var(--wbr);border-radius:8px;max-height:170px;overflow-y:auto;z-index:50;box-shadow:var(--sh);display:none}
.stock-search-results.show{display:block}
.stock-result-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--ibr);transition:background .12s}
.stock-result-item:last-child{border:none}
.stock-result-item:hover{background:#2563eb26}
.stock-result-left{min-width:0;flex:1}
.stock-result-sym{font-weight:700;font-family:var(--mono);margin-right:7px;color:var(--c5);font-size:11.5px}
.stock-result-name{color:var(--sc);font-size:10.5px}
.stock-result-empty{padding:10px;text-align:center;font-size:10.5px;color:var(--sc);opacity:.7}
.stock-result-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.stock-result-meta{text-align:right;font-family:var(--mono);font-size:9.5px;color:var(--sc);min-width:44px}
.stock-result-meta .srp{display:block;font-size:11px;font-weight:600;color:var(--wc)}
.stock-result-meta .src{display:block;margin-top:1px}
.stock-result-add{background:transparent;border:none;color:var(--c5);cursor:pointer;flex-shrink:0;display:flex;padding:2px;border-radius:5px;transition:background .12s}
.stock-result-add:hover{background:#2563eb3d}
.stock-result-add .ic{width:13px;height:13px}

/* ══ 타이머 ══ */
.tdisp{font-weight:600;text-align:center;font-family:var(--mono);letter-spacing:-.02em;cursor:pointer;font-variant-numeric:tabular-nums}
.tdisp[contenteditable=true]{outline:none;border-bottom:1.5px solid var(--c4)}
.tctrls{display:flex;gap:6px;justify-content:center;margin-top:11px;flex-shrink:0}
.tbtn{background:#10234066;border:1px solid var(--ibr);border-radius:7px;color:var(--wc);cursor:pointer;padding:6px 14px;font-size:11.5px;font-family:var(--wf);font-weight:500;transition:all .15s}
.tbtn:hover{background:var(--n3);border-color:var(--c3)}
.tbtn.primary{background:var(--c3);border-color:var(--c3);color:#fff}
.tbtn.primary:hover{background:var(--c2)}
.tpres{display:flex;gap:4px;justify-content:center;margin-top:7px;flex-wrap:wrap;flex-shrink:0}
.tpre{background:transparent;border:1px solid var(--ibr);border-radius:5px;color:var(--sc);cursor:pointer;padding:3px 8px;font-size:10px;font-family:var(--mono);transition:all .15s}
.tpre:hover{background:#2563eb26;color:var(--wc);border-color:var(--c3)}
.tmode{display:flex;gap:3px;margin-bottom:9px;justify-content:center;flex-shrink:0;background:var(--ib);padding:3px;border-radius:8px;border:1px solid var(--ibr)}
.tmbtn{background:transparent;border:none;border-radius:5px;color:var(--sc);cursor:pointer;padding:4px 12px;font-size:10.5px;font-family:var(--wf);font-weight:500;transition:all .15s}
.tmbtn.active{background:var(--c3);color:#fff}
.thint{font-size:9.5px;color:var(--sc);text-align:center;margin-top:5px;opacity:.6}
.pomo-phase{font-size:11px;color:var(--c5);text-align:center;margin-bottom:5px;flex-shrink:0;font-weight:600;letter-spacing:.03em}
.pomo-count{font-size:10px;color:var(--sc);text-align:center;margin-top:7px;flex-shrink:0;font-family:var(--mono);opacity:.75}

/* ══ 계산기 ══ */
.calc-disp{background:var(--ib);border:1px solid var(--ibr);border-radius:9px;padding:9px 12px;margin-bottom:8px;flex-shrink:0}
.calc-expr{font-size:10.5px;color:var(--sc);font-family:var(--mono);min-height:15px;text-align:right;opacity:.7}
.calc-res{font-size:22px;font-weight:600;color:var(--wc);font-family:var(--mono);text-align:right;letter-spacing:-.02em}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:1}
.cbtn2{background:#10234066;border:1px solid var(--ibr);border-radius:7px;color:var(--wc);cursor:pointer;font-size:13px;font-family:var(--mono);font-weight:500;display:flex;align-items:center;justify-content:center;padding:7px 0;transition:all .1s}
.cbtn2:hover{background:var(--n3);border-color:var(--c3)}
.cbtn2:active{transform:scale(.94)}
.cbtn2.op{color:var(--c5);border-color:#2563eb4d}
.cbtn2.eq{background:var(--c3);border-color:var(--c3);color:#fff}
.cbtn2.eq:hover{background:var(--c2)}
.cbtn2.clr{color:#f87171;border-color:#ef444440}

/* ══ 습관 ══ */
.habit-list{flex:1;overflow-y:auto}
.habit-item{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--ibr)}
.habit-item:last-child{border:none}
.hchk{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--c2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.hchk.done{background:var(--c3);border-color:var(--c3)}
.hchk .ic{width:12px;height:12px;color:#fff;stroke-width:3;opacity:0}
.hchk.done .ic{opacity:1}
.hn{flex:1;font-size:12.5px;color:var(--wc)}
.hst{font-size:10px;color:var(--c5);white-space:nowrap;font-family:var(--mono);display:flex;align-items:center;gap:3px}
.hst .ic{width:10px;height:10px}
.hdel{background:transparent;border:none;color:var(--dg);cursor:pointer;opacity:0;display:flex;transition:opacity .15s}
.hdel .ic{width:11px;height:11px}
.habit-item:hover .hdel{opacity:.7}
.hinput{background:transparent;border:none;border-top:1px solid var(--ibr);color:var(--wc);font-family:var(--wf);font-size:12.5px;padding:8px 0 3px;outline:none;margin-top:4px;width:100%;flex-shrink:0}
.hinput::placeholder{color:var(--lc);opacity:.55}
.hdate{font-size:9.5px;color:var(--sc);margin-top:5px;flex-shrink:0;font-family:var(--mono);opacity:.7}

/* ══ 카운터 ══ */
.cnt-num{font-size:40px;font-weight:700;color:var(--c5);text-align:center;font-family:var(--mono);line-height:1;flex:1;display:flex;align-items:center;justify-content:center;letter-spacing:-.04em}
.cnt-ctrls{display:flex;gap:6px;justify-content:center;margin-top:9px;flex-shrink:0}
.cnt-btn{background:#10234066;border:1px solid var(--ibr);border-radius:8px;color:var(--wc);cursor:pointer;padding:7px 16px;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:11px;font-family:var(--wf)}
.cnt-btn .ic{width:15px;height:15px}
.cnt-btn:hover{background:var(--n3);border-color:var(--c3)}
.cnt-btn.plus{background:var(--c3);border-color:var(--c3);color:#fff}
.cnt-btn.plus:hover{background:var(--c2)}
.cnt-label{font-size:10.5px;color:var(--sc);text-align:center;outline:none;flex-shrink:0;cursor:text;opacity:.8}

/* ══ 링크 ══ */
.links-list{flex:1;overflow-y:auto}
.lki{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--ibr);cursor:pointer;transition:padding-left .15s}
.lki:last-child{border:none}
.lki:hover{padding-left:3px}
.lki:hover .lkn{color:var(--c5)}
.lkn{flex:1;font-size:12.5px;color:var(--wc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}
.lku{font-size:9.5px;color:var(--sc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7;font-family:var(--mono)}
.lkd{background:transparent;border:none;color:var(--dg);cursor:pointer;opacity:0;flex-shrink:0;display:flex;transition:opacity .15s}
.lkd .ic{width:11px;height:11px}
.lki:hover .lkd{opacity:.7}
.lk-form{display:flex;flex-direction:column;gap:5px;margin-top:8px;flex-shrink:0;border-top:1px solid var(--ibr);padding-top:8px}
.lk-field{background:var(--ib);border:1px solid var(--ibr);border-radius:6px;color:var(--wc);font-family:var(--wf);font-size:11.5px;padding:5px 9px;outline:none;width:100%;transition:border-color .15s}
.lk-field:focus{border-color:var(--c3)}
.lk-field::placeholder{color:var(--lc);opacity:.5}
.lk-addbtn{background:var(--c3);border:none;border-radius:6px;color:#fff;cursor:pointer;padding:6px;font-size:11.5px;font-family:var(--wf);font-weight:500;transition:background .15s}
.lk-addbtn:hover{background:var(--c2)}

/* ══ 클립보드 ══ */
.clip-clearbtn{background:transparent;border:1px solid var(--ibr);border-radius:5px;color:var(--sc);cursor:pointer;padding:2px 8px;font-size:9px;font-family:var(--wf);margin-left:auto;transition:all .15s}
.clip-clearbtn:hover{background:#7f1d1d33;border-color:#ef444466;color:#f87171}
.clip-list{flex:1;overflow-y:auto}
.clip-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--ibr);cursor:pointer;transition:background .15s,padding-left .15s}
.clip-item:last-child{border:none}
.clip-item:hover{padding-left:3px}
.clip-item.copied{background:#22c55e26}
.clip-text{flex:1;min-width:0;font-size:12px;color:var(--wc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip-del{background:transparent;border:none;color:var(--dg);cursor:pointer;opacity:0;flex-shrink:0;display:flex;transition:opacity .15s}
.clip-del .ic{width:11px;height:11px}
.clip-item:hover .clip-del{opacity:.7}

/* ══ 바로가기(프로그램 런처) ══ */
.launch-list{flex:1;overflow-y:auto}
.launch-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--ibr);cursor:pointer;transition:padding-left .15s}
.launch-item:last-child{border:none}
.launch-item:hover{padding-left:3px}
.launch-item:hover .launch-name-t{color:var(--c5)}
.launch-info{flex:1;min-width:0}
.launch-name-t{font-size:12.5px;color:var(--wc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}
.launch-path-t{font-size:9.5px;color:var(--sc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7;font-family:var(--mono);margin-top:1px}
.launch-del{background:transparent;border:none;color:var(--dg);cursor:pointer;opacity:0;flex-shrink:0;display:flex;transition:opacity .15s}
.launch-del .ic{width:11px;height:11px}
.launch-item:hover .launch-del{opacity:.7}
.launch-path{margin-top:8px;flex-shrink:0}
.launch-path.drag{border-color:var(--c3);background:#2563eb1a}
.launch-row2{display:flex;gap:6px;margin-top:6px;flex-shrink:0}
.launch-row2 .launch-name{flex:1}
.launch-msg{font-size:9.5px;margin-top:5px;min-height:12px;text-align:center;flex-shrink:0;opacity:.9}
.launch-msg.err{color:#f87171}
.launch-msg.ok{color:#4ade80}

/* ══ D-day ══ */
.dday-list{flex:1;overflow-y:auto}
.dday-item{padding:7px 0;border-bottom:1px solid var(--ibr)}
.dday-item:last-child{border:none}
.ddn{font-size:12px;color:var(--wc)}
.ddc{font-size:19px;font-weight:700;color:var(--c5);font-family:var(--mono);line-height:1;letter-spacing:-.03em}
.ddd{font-size:9.5px;color:var(--sc);opacity:.7;font-family:var(--mono);margin-top:2px}
.dday-add{display:flex;gap:4px;margin-top:8px;flex-shrink:0;flex-wrap:wrap}
.dday-ni{flex:1;min-width:76px;background:var(--ib);border:1px solid var(--ibr);border-radius:6px;color:var(--wc);font-family:var(--wf);font-size:11.5px;padding:5px 9px;outline:none}
.dday-di{width:116px;background:var(--ib);border:1px solid var(--ibr);border-radius:6px;color:var(--wc);font-family:var(--mono);font-size:11px;padding:5px 8px;outline:none}
.dday-ab{background:var(--c3);border:none;border-radius:6px;color:#fff;cursor:pointer;padding:5px 11px;display:flex;align-items:center;transition:background .15s}
.dday-ab:hover{background:var(--c2)}
.dday-ab .ic{width:13px;height:13px}
.ddel{background:transparent;border:none;color:var(--dg);cursor:pointer;display:flex;opacity:.6}
.ddel:hover{opacity:1}
.ddel .ic{width:11px;height:11px}

/* ══ 명언 ══ */
.quote-text{font-size:13px;color:var(--wc);line-height:1.65;flex:1;display:flex;align-items:center;text-align:center;padding:6px 2px;font-weight:400}
.quote-author{font-size:10.5px;color:var(--sc);text-align:right;flex-shrink:0;margin-top:7px;opacity:.8}
.quote-btn{background:transparent;border:1px solid var(--ibr);border-radius:6px;color:var(--sc);cursor:pointer;font-size:10.5px;padding:6px;font-family:var(--wf);margin-top:8px;flex-shrink:0;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.quote-btn:hover{color:var(--wc);border-color:var(--c3);background:#2563eb1a}
.quote-btn .ic{width:12px;height:12px}

/* ══ 주사위 ══ */
.dice-result{font-size:48px;text-align:center;flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;color:var(--c5);letter-spacing:-.04em}
.dice-ctrls{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;flex-shrink:0}
.dice-btn{background:transparent;border:1px solid var(--ibr);border-radius:5px;color:var(--sc);cursor:pointer;padding:4px 9px;font-size:10px;font-family:var(--mono);transition:all .15s}
.dice-btn.active{background:var(--c3);border-color:var(--c3);color:#fff}
.dice-roll{background:var(--c3);border:none;border-radius:7px;color:#fff;cursor:pointer;padding:7px;font-size:11.5px;font-family:var(--wf);font-weight:500;width:100%;margin-top:8px;flex-shrink:0;transition:background .15s}
.dice-roll:hover{background:var(--c2)}

/* ══ 단위변환 ══ */
.cvt-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-shrink:0}
.cvt-input{flex:1;background:var(--ib);border:1px solid var(--ibr);border-radius:7px;color:var(--wc);font-family:var(--mono);font-size:13px;padding:7px 9px;outline:none;min-width:0;transition:border-color .15s}
.cvt-input:focus{border-color:var(--c3)}
.cvt-sel{background:var(--ib);border:1px solid var(--ibr);border-radius:7px;color:var(--wc);font-family:var(--wf);font-size:11px;padding:7px 5px;outline:none;cursor:pointer}
.cvt-sel option{background:#0b1830;color:#dbeafe}
.cvt-swap{background:transparent;border:1px solid var(--ibr);border-radius:6px;color:var(--sc);cursor:pointer;padding:5px;width:100%;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:5px;font-size:10.5px;font-family:var(--wf);transition:all .15s}
.cvt-swap:hover{color:var(--wc);border-color:var(--c3)}
.cvt-swap .ic{width:12px;height:12px}
.cvt-cat{display:flex;gap:3px;margin-bottom:9px;flex-shrink:0;background:var(--ib);padding:3px;border-radius:7px;border:1px solid var(--ibr)}
.cvt-cbtn{flex:1;background:transparent;border:none;border-radius:5px;color:var(--sc);cursor:pointer;padding:4px;font-size:10px;font-family:var(--wf);font-weight:500;transition:all .15s}
.cvt-cbtn.active{background:var(--c3);color:#fff}

/* ══ 번역기 ══ */
.tr-area{width:100%;background:var(--ib);border:1px solid var(--ibr);border-radius:7px;color:var(--wc);font-family:var(--wf);font-size:11.5px;padding:7px 9px;outline:none;resize:none;flex:1;min-height:38px;transition:border-color .15s}
.tr-area:focus{border-color:var(--c3)}
.tr-area::placeholder{color:var(--lc);opacity:.45}
.tr-out{background:#04081440;cursor:default}
.tr-row{display:flex;gap:4px;align-items:center;margin:7px 0;flex-shrink:0}
.tr-sel{flex:1;background:var(--ib);border:1px solid var(--ibr);border-radius:6px;color:var(--wc);font-family:var(--wf);font-size:10.5px;padding:5px;outline:none;cursor:pointer}
.tr-sel option{background:#0b1830;color:#dbeafe}
.tr-swap{background:transparent;border:1px solid var(--ibr);border-radius:6px;color:var(--sc);cursor:pointer;padding:5px 7px;display:flex;align-items:center;transition:all .15s}
.tr-swap:hover{color:var(--wc);border-color:var(--c3)}
.tr-swap .ic{width:12px;height:12px}
.tr-btn{background:var(--c3);border:none;border-radius:7px;color:#fff;cursor:pointer;padding:7px;font-size:11.5px;font-family:var(--wf);font-weight:500;width:100%;margin-top:7px;flex-shrink:0;transition:background .15s}
.tr-btn:hover{background:var(--c2)}

/* ══ 색상 피커 ══ */
.cp-preview{width:100%;height:54px;border-radius:9px;border:1px solid var(--ibr);flex-shrink:0;margin-bottom:9px}
.cp-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-shrink:0}
.cp-lbl{font-size:9.5px;color:var(--lc);width:12px;flex-shrink:0;font-family:var(--mono);font-weight:600}
.cp-slider{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;outline:none;cursor:pointer}
.cp-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid #0b1830;cursor:pointer;box-shadow:0 1px 4px #0006}
.cp-val{font-size:10px;color:var(--wc);width:26px;text-align:right;flex-shrink:0;font-family:var(--mono)}
.cp-hex{width:100%;background:var(--ib);border:1px solid var(--ibr);border-radius:6px;color:var(--wc);font-family:var(--mono);font-size:12px;padding:6px 9px;outline:none;text-align:center;flex-shrink:0;margin-top:5px;letter-spacing:.06em;transition:border-color .15s}
.cp-hex:focus{border-color:var(--c3)}
.cp-copy{background:transparent;border:1px solid var(--ibr);border-radius:6px;color:var(--sc);cursor:pointer;padding:5px;font-size:10.5px;font-family:var(--wf);width:100%;margin-top:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.cp-copy:hover{color:var(--wc);border-color:var(--c3)}
.cp-copy .ic{width:11px;height:11px}

/* ══ 그래프 ══ */
.chart-canvas{flex:1;width:100%;min-height:56px}
.chart-form{display:flex;gap:4px;margin-top:7px;flex-shrink:0}
.chart-in{flex:1;min-width:0;background:var(--ib);border:1px solid var(--ibr);border-radius:6px;color:var(--wc);font-family:var(--wf);font-size:11px;padding:5px 8px;outline:none;transition:border-color .15s}
.chart-in:focus{border-color:var(--c3)}
.chart-in::placeholder{color:var(--lc);opacity:.5}
.chart-btn{background:var(--c3);border:none;border-radius:6px;color:#fff;cursor:pointer;padding:5px 10px;display:flex;align-items:center;transition:background .15s}
.chart-btn:hover{background:var(--c2)}
.chart-btn .ic{width:13px;height:13px}
.chart-list{max-height:92px;overflow-y:auto;flex-shrink:0;margin-top:5px}
.chart-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--ibr);font-size:10.5px;color:var(--sc);font-family:var(--mono)}
.chart-item:last-child{border:none}
.chart-del{background:transparent;border:none;color:var(--dg);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.85;padding:3px;border-radius:5px;flex-shrink:0}
.chart-del:hover{opacity:1;background:#7f1d1d33}
.chart-del .ic{width:12px;height:12px;stroke-width:2.2}

/* ══ 스네이크 ══ */
.snake-canvas{width:100%;aspect-ratio:1;background:var(--ib);border:1px solid var(--ibr);border-radius:9px;flex-shrink:0;display:block}
.snake-info{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sc);flex-shrink:0;margin-bottom:7px;font-family:var(--mono)}
.snake-btn{background:var(--c3);border:none;border-radius:7px;color:#fff;cursor:pointer;padding:7px;font-size:11.5px;font-family:var(--wf);font-weight:500;width:100%;margin-top:8px;flex-shrink:0;transition:background .15s}
.snake-btn:hover{background:var(--c2)}

/* ══ 스포츠 ══ */
.sp-tabs{display:flex;gap:3px;margin-bottom:8px;flex-wrap:wrap;flex-shrink:0}
.sp-tab{background:transparent;border:1px solid var(--ibr);border-radius:5px;color:var(--sc);cursor:pointer;font-size:9.5px;padding:3px 7px;font-family:var(--wf);font-weight:500;white-space:nowrap;transition:all .15s}
.sp-tab:hover{border-color:var(--c3);color:var(--wc)}
.sp-tab.active{background:var(--c3);border-color:var(--c3);color:#fff}
.sp-list{flex:1;overflow-y:auto}
.sp-item{padding:7px 0;border-bottom:1px solid var(--ibr);cursor:pointer;transition:padding-left .15s}
.sp-item:last-child{border:none}
.sp-item:hover{padding-left:3px}
.sp-row{display:flex;justify-content:space-between;align-items:center;gap:5px}
.sp-team{font-size:11px;color:var(--wc);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-team.right{text-align:right}
.sp-score{font-size:12px;font-weight:700;color:var(--c5);font-family:var(--mono);white-space:nowrap;padding:0 5px;flex-shrink:0}
.sp-meta{font-size:9px;color:var(--sc);margin-top:3px;display:flex;gap:6px;align-items:center;opacity:.75;font-family:var(--mono)}
.sp-live{color:#4ade80;font-size:9px;font-weight:600}
.sp-err{font-size:11px;color:var(--sc);text-align:center;padding:16px 8px;line-height:1.6;opacity:.75;white-space:pre-line}
.sp-updated{font-size:9px;color:var(--sc);text-align:right;margin-top:5px;flex-shrink:0;opacity:.6;font-family:var(--mono)}
.sp-item.big{padding:11px 0}
.sp-big-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sp-side{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:0}
.sp-logo{width:36px;height:36px;object-fit:contain;flex-shrink:0}
.sp-logo-fb{width:36px;height:36px;border-radius:9px;background:var(--ib);border:1px solid var(--ibr);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sc);flex-shrink:0;font-family:var(--mono)}
.sp-tname{font-size:10.5px;color:var(--wc);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sp-center{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;padding:0 5px}
.sp-bigscore{font-size:19px;font-weight:700;color:var(--wc);font-family:var(--mono);white-space:nowrap;letter-spacing:-.03em}
.sp-bigscore.live{color:#4ade80}
.sp-vs{font-size:12px;color:var(--sc);font-family:var(--mono);font-weight:600}
.sp-bigmeta{font-size:8.5px;color:var(--sc);white-space:nowrap;font-family:var(--mono);opacity:.8}
.sp-bigmeta.live{color:#4ade80;opacity:1;font-weight:700}
.sp-bar-wrap{display:flex;height:3px;border-radius:2px;overflow:hidden;margin-top:9px;background:var(--bg)}
.sp-bar-h{background:var(--c4);transition:width .4s}
.sp-bar-a{background:#f87171;transition:width .4s}
.sp-record{font-size:8.5px;color:var(--sc);opacity:.7;font-family:var(--mono)}
.gcal-btn{background:var(--c3);border:none;border-radius:7px;color:#fff;cursor:pointer;padding:7px 14px;font-size:11.5px;font-family:var(--wf);font-weight:500;width:100%;transition:background .15s}
.gcal-btn:hover{background:var(--c2)}

/* ══ 전체 위젯 텍스트 가독성 강화 (단일 통합 블록) ══ */

.cnt-label{font-size:12px !important}

.chart-in{font-size:12.5px !important}

.todo-list,.ti,.memo-in,.news-list,.exchange-row,.stock-row{font-size:14px !important}

/* ── 스포츠 위젯: 실시간 정보가 한눈에 들어오도록 특히 크게 ── */
.sp-tab{font-size:12.5px !important;padding:6px 10px !important}
.sp-team{font-size:15px !important}
.sp-score{font-size:17px !important}
.sp-meta{font-size:12px !important}
.sp-live{font-size:12px !important}
.sp-err{font-size:14px !important}
.sp-updated{font-size:11.5px !important}

const WTIMERS={}
function regTimer(w,id){
  if(!WTIMERS[w.id])WTIMERS[w.id]=[]
  WTIMERS[w.id].push(id)
  return id
}
function clearTimers(wid){
  if(WTIMERS[wid]){
    WTIMERS[wid].forEach(id=>clearInterval(id))
    delete WTIMERS[wid]
  }
}

function svgIc(id,cls){
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg')
  s.setAttribute('class','ic'+(cls?' '+cls:''))
  const u=document.createElementNS('http://www.w3.org/2000/svg','use')
  u.setAttribute('href','#'+id)
  s.appendChild(u);return s
}

function applyOpacity(v){
  settings.opacity=v
  const st=getComputedStyle(document.body)
  const cur=st.getPropertyValue('--wb').trim()
  const m=cur.match(/rgba?\(([\d\s,.]+)\)/)
  if(m){
    const p=m[1].split(',').map(s=>s.trim())
    document.body.style.setProperty('--wb','rgba('+p[0]+','+p[1]+','+p[2]+','+(v/100)+')')
  }
  const val=document.getElementById('opacity-val')
  if(val)val.textContent=v+'%'
  saveSettings()
}

function mascotSVG(th){
  const acc=MASCOT_ACCESSORY[th]!==undefined?MASCOT_ACCESSORY[th]:MASCOT_ACCESSORY['']
  return '<svg viewBox="0 0 64 64">'
    +'<ellipse cx="32" cy="40" rx="23" ry="19" fill="var(--ac)" opacity=".94"/>'
    +'<ellipse cx="32" cy="40" rx="23" ry="19" fill="none" stroke="var(--c6)" stroke-width="1.4" opacity=".55"/>'
    +'<circle cx="23.5" cy="37" r="3.3" fill="var(--n0)"/>'
    +'<circle cx="40.5" cy="37" r="3.3" fill="var(--n0)"/>'
    +'<circle cx="24.6" cy="35.9" r="1" fill="#fff" opacity=".85"/>'
    +'<circle cx="41.6" cy="35.9" r="1" fill="#fff" opacity=".85"/>'
    +'<path d="M22 46c4 3.5 16 3.5 20 0" stroke="var(--n0)" stroke-width="2.2" fill="none" stroke-linecap="round"/>'
    +'<g transform="translate(38,6)" style="color:var(--c7)">'+acc+'</g>'
    +'</svg>'
}

function renderMascot(th){
  const el=document.getElementById('mascot')

function setTheme(th){
  document.body.style.removeProperty('--wb')

  const ab=document.getElementById('tpbtn-'+(th||'default'))
  if(ab)ab.classList.add('active')
  document.getElementById('theme-panel').classList.remove('show')
  setTimeout(()=>applyOpacity(settings.opacity),30)
  renderMascot(th)
}

function showCtx(e,w){
  e.preventDefault();ctxW=w

function showCPick(e,dot,cb){
  e.stopPropagation()
  const p=document.getElementById('cpick');p.innerHTML=''

  nc.style.cssText='background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3)'
  nc.onclick=()=>{dot.style.background='rgba(255,255,255,.15)';if(cb)cb('');p.classList.remove('show')}

    const d=document.createElement('div');d.className='cdot';d.style.background=c
    d.onclick=()=>{dot.style.background=c;if(cb)cb(c);p.classList.remove('show')}

  })

  p.style.top=Math.min(e.clientY+4,window.innerHeight-100)+'px'

function updScale(w){
  const ow=w.offsetWidth,oh=w.offsetHeight,type=w.dataset.type,S=ow<200,L=ow>280
  if(type==='clock'){
    const sa=ow>240&&oh>200
    const a=w.querySelector('.analog-wrap'),d=w.querySelector('.clock-digital')
    if(a)a.classList.toggle('show',sa)
    if(d)d.style.display=sa?'none':'flex'
    if(!sa){
      const t=w.querySelector('.clock-time'),dd=w.querySelector('.clock-date')
      if(t)t.style.fontSize=S?'20px':L?'40px':'29px'
      if(dd){dd.style.fontSize=S?'11.5px':L?'15px':'12.5px';dd.style.display=oh<90?'none':''}
    }
  }
  if(type==='weather'){
    const i=w.querySelector('.wx-icon'),t=w.querySelector('.wx-temp')
    const dt=w.querySelector('.wx-detail'),hl=w.querySelector('.wx-hl'),ds=w.querySelector('.wx-desc')
    if(i)i.style.fontSize=S?'22px':L?'42px':'30px'
    if(t)t.style.fontSize=S?'18px':L?'34px':'22px'
    if(ds)ds.style.fontSize=S?'10px':'12px'
    if(hl)hl.style.display=oh<150?'none':''
    if(dt)dt.style.display=oh<180?'none':'flex'
  }
  if(type==='calendar'){
    const cs=w.querySelectorAll('.cal-cell,.cal-day')
    const sz=Math.max(14,Math.min(36,Math.floor((ow-32)/7))),rh=Math.max(16,Math.min(40,Math.floor((oh-80)/8)))
    cs.forEach(el=>{el.style.fontSize=sz<18?'12px':sz<24?'14px':'15px';el.style.width=sz+'px';el.style.height=rh+'px'})
  }
  if(type==='timer'||type==='pomodoro'){const d=w.querySelector('.tdisp');if(d)d.style.fontSize=S?'25px':L?'44px':'36px'}
  if(type==='calc')w.querySelectorAll('.cbtn2').forEach(b=>b.style.fontSize=S?'14px':L?'18px':'16px')
  if(type==='counter'){const n=w.querySelector('.cnt-num');if(n)n.style.fontSize=S?'36px':L?'60px':'46px'}
  if(type==='dice'){const d=w.querySelector('.dice-result');if(d)d.style.fontSize=S?'40px':L?'68px':'56px'}
}

function makeDrag(w){
  let drag=false,sx,sy,ox,oy
  w.addEventListener('mousedown',e=>{
    if(e.button!==2)bringToFront(w)
    if(settings&&settings.locked)return
    const tag=e.target.tagName
    if(tag==='INPUT'||tag==='BUTTON'||tag==='TEXTAREA'||tag==='SELECT'||tag==='OPTION')return
    if(e.target.closest('.rh')||e.target.getAttribute('contenteditable')==='true'||
       e.target.closest('.lki')||e.target.closest('.ni')||e.target.closest('.ri')||
       e.target.closest('.sti')||e.target.closest('.cal-cell')||e.target.closest('.cal-dcbtn')||
       e.target.classList.contains('tc')||e.target.classList.contains('hchk')||
       e.target.classList.contains('tdisp')||e.target.classList.contains('vol-icon'))return
    if(e.button===2)return
    drag=true;sx=e.clientX;sy=e.clientY
    ox=parseInt(w.style.left)||0;oy=parseInt(w.style.top)||0
    e.preventDefault()
  })
  document.addEventListener('mousemove',e=>{if(!drag)return;w.style.left=(ox+e.clientX-sx)+'px';w.style.top=(oy+e.clientY-sy)+'px'})
  document.addEventListener('mouseup',()=>{if(drag){drag=false;save()}})
  w.addEventListener('contextmenu',e=>showCtx(e,w))
}

function makeResize(w){
  if(w.dataset.type==='snake')return
  const h=w.querySelector('.rh');if(!h)return
  let rz=false,sx,sy,ow,oh
  h.addEventListener('mousedown',e=>{if(settings&&settings.locked)return;bringToFront(w);rz=true;sx=e.clientX;sy=e.clientY;ow=w.offsetWidth;oh=w.offsetHeight;e.preventDefault();e.stopPropagation()})
  document.addEventListener('mousemove',e=>{if(!rz)return;w.style.width=Math.max(160,ow+e.clientX-sx)+'px';w.style.height=Math.max(80,oh+e.clientY-sy)+'px';updScale(w);if(w._redraw)w._redraw()})
  document.addEventListener('mouseup',()=>{if(rz){rz=false;save()}})
}

function save(){
  const d=[]
  document.querySelectorAll('.widget').forEach(w=>d.push({id:w.id,type:w.dataset.type,left:w.style.left,top:w.style.top,width:w.style.width,height:w.style.height,z:parseInt(w.style.zIndex)||1}))
  localStorage.setItem('wcw',JSON.stringify(d))
}
window.addEventListener('beforeunload',()=>{save();saveSettings()})
setInterval(save,3000)

function addWidget(type,left,top,width,height,fixedId,fixedZ){
  wCount++
  const id=fixedId||('w'+Date.now()+'_'+wCount)
  const x=left||(80+(wCount%5)*30)+'px',y=top||(60+(wCount%3)*30)+'px'
  const d=document.createElement('div')
  d.className='widget widget-enter';d.id=id;d.dataset.type=type
  d.style.left=x;d.style.top=y
  if(width)d.style.width=width
  if(height)d.style.height=height
  d.innerHTML=TPL[type]||''
  document.getElementById('wcon').appendChild(d)
  // 저장돼있던 z-index(마지막으로 앞에 있던 순서)가 있으면 그대로 복원하고,
  // 없으면(모달에서 새로 추가한 위젯) 항상 맨 앞으로 오도록 새 z-index를 부여한다.
  if(fixedZ){
    const z=parseInt(fixedZ)||1
    d.style.zIndex=z
    if(z>topZ)topZ=z
  }else{
    bringToFront(d)
  }
  makeDrag(d);makeResize(d)
  d.addEventListener('mouseenter',()=>sm(false))
  d.addEventListener('mouseleave',()=>sm(true))
  if(settings&&settings.locked){const h=d.querySelector('.rh');if(h)h.style.display='none'}
  const F={clock:initClock,calendar:initCalendar,
    todo:initTodo,memo:initMemo,habit:initHabit,counter:initCounter,
    news:initNews,exchange:initExchange,stock:initStock,links:initLinks,
    timer:initTimer,pomodoro:initPomodoro,calc:initCalc,convert:initConvert,
    dday:initDday,quote:initQuote,dice:initDice,
    translate:initTranslate,colorpick:initColorpick,chart:initChart,snake:initSnake,sports:initSports,
    clipboard:initClipboard,launcher:initLauncher}
  if(F[type])F[type](d)
  updScale(d);closeModal();save()
  setTimeout(()=>{if(d._redraw)d._redraw()},50)
  // 추가 애니메이션이 끝나면 클래스를 제거해서 이후 리사이즈 등에서 재생되지 않게 한다.
  d.addEventListener('animationend',()=>d.classList.remove('widget-enter'),{once:true})
}

function initClock(w){
  const cv=w.querySelector('.ac')
  function draw(){
    const n=new Date(),h=n.getHours()%12,m=n.getMinutes(),s=n.getSeconds()
    const sz=cv.width,cx=sz/2,cy=sz/2,r=sz/2-10
    const st=getComputedStyle(document.body)
    const ac=st.getPropertyValue('--ac').trim()||'#4f8ef7'
    const wc=st.getPropertyValue('--wc').trim()||'#fff'
    const sc=st.getPropertyValue('--sc').trim()||'rgba(255,255,255,.5)'
    const c=cv.getContext('2d')
    c.clearRect(0,0,sz,sz)
    c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.strokeStyle=sc;c.lineWidth=2;c.stroke()
    for(let i=1;i<=12;i++){
      const a=(i/12)*Math.PI*2-Math.PI/2
      c.fillStyle=sc;c.font='bold '+Math.floor(sz*.09)+'px sans-serif'
      c.textAlign='center';c.textBaseline='middle'
      c.fillText(i,cx+Math.cos(a)*(r-16),cy+Math.sin(a)*(r-16))
    }
    function hand(ang,len,lw,col){
      const a=ang-Math.PI/2
      c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len)
      c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.stroke()
    }
    hand((h/12+m/720)*Math.PI*2,r*.5,4,wc)
    hand((m/60+s/3600)*Math.PI*2,r*.7,3,wc)
    hand((s/60)*Math.PI*2,r*.85,2,ac)
    c.beginPath();c.arc(cx,cy,5,0,Math.PI*2);c.fillStyle=ac;c.fill()
  }
  function tick(){
    const n=new Date(),p=v=>String(v).padStart(2,'0')
    const t=w.querySelector('.clock-time'),dt=w.querySelector('.clock-date')
    if(t)t.textContent=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds())
    const dd=['일','월','화','수','목','금','토']
    if(dt)dt.textContent=n.getFullYear()+'년 '+(n.getMonth()+1)+'월 '+n.getDate()+'일 '+dd[n.getDay()]+'요일'
    const a=w.querySelector('.analog-wrap')
    if(a&&a.classList.contains('show')){
      const s=Math.min(a.offsetWidth,a.offsetHeight)-10
      if(s>60){cv.width=s;cv.height=s;draw()}
    }
  }
  tick();regTimer(w,setInterval(tick,1000))
}




function initTodo(w){
  const K='wcw-todo-'+w.id
  const list=w.querySelector('.todo-list'),inp=w.querySelector('.tinput'),cnt=w.querySelector('.tcount')
  let tasks=[]
  try{tasks=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){tasks=[]}
  function sv(){localStorage.setItem(K,JSON.stringify(tasks))}
  function render(){
    list.innerHTML=''
    tasks.forEach((t,i)=>{
      const it=document.createElement('div');it.className='ti'
      const ck=document.createElement('div');ck.className=t.done?'tcheck on':'tcheck'
      ck.appendChild(svgIc('i-check'))
      const dt=document.createElement('div');dt.className='tc';dt.style.background=t.color||'var(--bg)'
      const tx=document.createElement('span');tx.className=t.done?'tt done':'tt';tx.setAttribute('contenteditable','true');tx.textContent=t.text
      const dl=document.createElement('button');dl.className='tdel';dl.appendChild(svgIc('i-x'))
      ck.addEventListener('click',e=>{e.stopPropagation();tasks[i].done=!tasks[i].done;ck.className=tasks[i].done?'tcheck on':'tcheck';tx.className=tasks[i].done?'tt done':'tt';sv();upd()})
      tx.addEventListener('mousedown',e=>e.stopPropagation())
      tx.addEventListener('input',()=>{tasks[i].text=tx.textContent;sv()})
      tx.addEventListener('blur',()=>{tasks[i].text=tx.textContent;sv()})
      dt.addEventListener('click',e=>showCPick(e,dt,c=>{tasks[i].color=c;sv()}))
      dl.addEventListener('click',e=>{e.stopPropagation();tasks.splice(i,1);sv();render()})
      it.appendChild(ck);it.appendChild(dt);it.appendChild(tx);it.appendChild(dl)
      list.appendChild(it)
    })
    upd()
  }
  function upd(){cnt.textContent=tasks.filter(t=>t.done).length+' / '+tasks.length}
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.stopPropagation();e.preventDefault()
      const v=inp.value.trim();if(!v)return
      tasks.push({text:v,done:false,color:''});sv();render();inp.value=''
    }
  })
  inp.addEventListener('mousedown',e=>e.stopPropagation())
  render()
}

function initHabit(w){
  const K='wcw-habits'
  const list=w.querySelector('.habit-list'),inp=w.querySelector('.hinput'),de=w.querySelector('.hdate')
  const today=new Date().toDateString()
  let habits=[]
  try{habits=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){habits=[]}
  function sv(){localStorage.setItem(K,JSON.stringify(habits))}
  function render(){
    const n=new Date();de.textContent=(n.getMonth()+1)+'월 '+n.getDate()+'일'
    list.innerHTML=''
    habits.forEach((h,i)=>{
      const done=h.dates&&h.dates.indexOf(today)>=0
      const it=document.createElement('div');it.className='habit-item'
      const ck=document.createElement('div');ck.className=done?'hchk done':'hchk'
      ck.appendChild(svgIc('i-check'))
      const nm=document.createElement('span');nm.className='hn';nm.textContent=h.name
      const st=document.createElement('span');st.className='hst'
      st.appendChild(svgIc('i-flame'))
      const stn=document.createElement('span');stn.textContent=(h.streak||0);st.appendChild(stn)
      const dl=document.createElement('button');dl.className='hdel';dl.appendChild(svgIc('i-x'))
      ck.addEventListener('click',e=>{
        e.stopPropagation()
        if(!h.dates)h.dates=[]
        if(done){h.dates=h.dates.filter(d=>d!==today);h.streak=Math.max(0,(h.streak||0)-1)}
        else{h.dates.push(today);h.streak=(h.streak||0)+1}
        sv();render()
      })
      dl.addEventListener('click',e=>{e.stopPropagation();habits.splice(i,1);sv();render()})
      it.appendChild(ck);it.appendChild(nm);it.appendChild(st);it.appendChild(dl)
      list.appendChild(it)
    })
  }
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.stopPropagation();e.preventDefault()
      const v=inp.value.trim();if(!v)return
      habits.push({name:v,dates:[],streak:0});sv();render();inp.value=''
    }
  })
  inp.addEventListener('mousedown',e=>e.stopPropagation())
  render()
}

function initCalendar(w){
  const t=new Date();w._cy=t.getFullYear();w._cm=t.getMonth();w._cs=null
  w.querySelector('.cal-prev').addEventListener('click',e=>{e.stopPropagation();w._cm--;if(w._cm<0){w._cm=11;w._cy--}renderCal(w)})
  w.querySelector('.cal-next').addEventListener('click',e=>{e.stopPropagation();w._cm++;if(w._cm>11){w._cm=0;w._cy++}renderCal(w)})
  const mt=w.querySelector('.cal-dmemo-text')
  if(mt){
    mt.addEventListener('mousedown',e=>e.stopPropagation())
    mt.addEventListener('input',()=>{if(!w._cs)return;if(!calData[w._cs])calData[w._cs]={};calData[w._cs].memo=mt.value;saveCalData();renderCal(w)})
  }
  renderCal(w)
}
function renderCal(w){
  const g=w.querySelector('.cal-grid'),y=w._cy,mo=w._cm,td=new Date()
  w.querySelector('.cal-mo').textContent=y+'년 '+(mo+1)+'월'
  g.innerHTML=''
  ;['일','월','화','수','목','금','토'].forEach(d=>{const e=document.createElement('div');e.className='cal-day';e.textContent=d;g.appendChild(e)})
  const f=new Date(y,mo,1).getDay(),l=new Date(y,mo+1,0).getDate(),pl=new Date(y,mo,0).getDate()
  for(let i=0;i<f;i++){const e=document.createElement('div');e.className='cal-cell other';e.textContent=pl-f+i+1;g.appendChild(e)}
  for(let d=1;d<=l;d++){
    const e=document.createElement('div')
    const isT=d===td.getDate()&&mo===td.getMonth()&&y===td.getFullYear()
    const k=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),dt=calData[k]
    e.className='cal-cell'+(isT?' today':'')+(w._cs===k?' selected':'')
    e.textContent=d
    if(dt&&dt.color){e.style.background=dt.color+'33';e.style.outline='1px solid '+dt.color+'55'}
    if(dt&&dt.memo)e.classList.add('has-memo')
    e.addEventListener('click',ev=>{ev.stopPropagation();w._cs=k;renderCal(w);openCalMemo(w,k)})
    g.appendChild(e)
  }
  updScale(w)
}
function openCalMemo(w,k){
  const p=w.querySelector('.cal-dmemo'),t=w.querySelector('.cal-dmemo-title')
  const x=w.querySelector('.cal-dmemo-text'),c=w.querySelector('.cal-dcols')
  if(!p)return

function initNews(w){
  const list=w.querySelector('.news-list')
  let loading=false
  async function load(){
    if(loading)return Promise.resolve()
    loading=true
    list.innerHTML=''
    const st=document.createElement('div');st.className='nst';st.textContent='불러오는 중...'
    list.appendChild(st)
    try{
      const xml=await ipcRenderer.invoke('fetch-news')
      if(!xml){list.innerHTML='';const e=document.createElement('div');e.className='nst';e.textContent='뉴스를 불러올 수 없어요';list.appendChild(e);loading=false;return}
      const doc=new DOMParser().parseFromString(xml,'text/xml')
      const items=Array.from(doc.querySelectorAll('item'))
      if(!items.length){list.innerHTML='';const e=document.createElement('div');e.className='nst';e.textContent='뉴스가 없어요';list.appendChild(e);loading=false;return}
      list.innerHTML=''
      items.slice(0,20).forEach(it=>{
        const te=it.querySelector('title'),se=it.querySelector('source'),le=it.querySelector('link')
        const title=te?te.textContent.replace(/ - [^-]+$/,''):''
        const src=se?se.textContent:'뉴스'
        const link=le?le.textContent:''
        const d=document.createElement('div');d.className='ni'
        const t=document.createElement('div');t.className='nt';t.textContent=title
        const s=document.createElement('div');s.className='ns';s.textContent=src
        d.appendChild(t);d.appendChild(s)
        d.addEventListener('click',e=>{e.stopPropagation();if(link)shell.openExternal(link)})
        list.appendChild(d)
      })
    }catch(err){
      list.innerHTML=''
      const e=document.createElement('div');e.className='nst';e.textContent='오류 발생'
      list.appendChild(e)
    }
    loading=false
  }
  const rb=w.querySelector('.news-rbtn')
  if(rb){
    rb.addEventListener('mousedown',e=>e.stopPropagation())
    rb.addEventListener('click',e=>{
      e.stopPropagation();e.preventDefault()
      rb.classList.add('spin');load().then(()=>setTimeout(()=>rb.classList.remove('spin'),300))
    })
  }
  load()
  // 뉴스가 더 자주 새로고침되도록 60초 → 20초로 단축.
  regTimer(w,setInterval(load,20*1000))
}

function initExchange(w){
  let prev={}
  w.querySelectorAll('.ri').forEach(i=>i.addEventListener('click',e=>{e.stopPropagation();const u=i.dataset.url;if(u)shell.openExternal(u)}))
  async function load(){
    try{
      // 브라우저 fetch()는 이 API들에서 종종 CORS로 막히므로, 메인 프로세스를 거치는
      // fetch-url IPC로 요청한다(뉴스·스포츠 위젯과 동일한 방식, CORS 영향을 받지 않음).
      // 예전 URL(api.exchangerate-api.com/v4)은 서비스가 종료되어 open.er-api.com으로 교체.
      const raw=await ipcRenderer.invoke('fetch-url','https://open.er-api.com/v6/latest/USD')
      if(!raw)throw new Error('환율 데이터를 받지 못했습니다')
      const d=JSON.parse(raw)
      if(d.result!=='success'||!d.rates)throw new Error('환율 응답 형식이 올바르지 않습니다')
      const K=d.rates.KRW,J=d.rates.JPY,E=d.rates.EUR,C=d.rates.CNY,G=d.rates.GBP
      if([K,J,E,C,G].some(v=>typeof v!=='number'||!isFinite(v)))throw new Error('환율 값이 비어있습니다')
      function set(vs,cs,val,pv){
        const e=w.querySelector(vs),ce=w.querySelector(cs)
        if(e)e.textContent=Math.round(val).toLocaleString()+'원'
        if(ce&&pv!==undefined){
          const df=val-pv,p=(df/pv*100).toFixed(2),s=df>0?'+':''
          ce.textContent=s+Math.round(df)+'원 ('+s+p+'%)'
          ce.className='rch '+(df>0?'cup':df<0?'cdn':'')
        }
      }
      set('.usd-val','.usd-chg',K,prev.usd)
      set('.jpy-val','.jpy-chg',K/J*100,prev.jpy)
      set('.eur-val','.eur-chg',K/E,prev.eur)
      set('.cny-val','.cny-chg',K/C,prev.cny)
      set('.gbp-val','.gbp-chg',K/G,prev.gbp)
      prev={usd:K,jpy:K/J*100,eur:K/E,cny:K/C,gbp:K/G}
      const u=w.querySelector('.rup')
      if(u)u.textContent='업데이트: '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})
    }catch(e){
      console.error('[WCW] 환율 위젯 갱신 실패:',e)
      w.querySelectorAll('.rv').forEach(el=>{el.textContent='연결 실패'})
    }
  }
  load();regTimer(w,setInterval(load,60*1000))
}

function localStockMatches(q){
  const ql=q.trim().toLowerCase()
  if(!ql)return[]
  const out=[]
  KOR_GLOBAL_ALIASES.forEach(x=>{
    if(x.k.toLowerCase().includes(ql)||ql.includes(x.k.toLowerCase())||x.s.toLowerCase().includes(ql))
      out.push({symbol:x.s,name:x.k,sub:x.n})
  })
  KR_MARKET_STOCKS.forEach(x=>{
    if(x.n.toLowerCase().includes(ql)||x.c.includes(ql))
      out.push({symbol:x.c+'.'+x.m,name:x.n})
  })
  return out
}

function stockKey(sym){return String(sym||'').replace(/[^a-zA-Z0-9]/g,'_')}

function stockUrlFor(symbol){
  const isKR=/\.(KS|KQ)$/i.test(symbol)
  if(isKR)return 'https://finance.naver.com/item/main.naver?code='+symbol.replace(/\.(KS|KQ)$/i,'')
  return 'https://finance.yahoo.com/quote/'+encodeURIComponent(symbol)
}

// 종목 시세 하나를 가져오는 공용 함수 — 관심목록 갱신과 검색결과 옆 표시에 함께 쓰인다.
// main 프로세스의 'fetch-yahoo' 채널을 쓴다 — 야후 파이낸스가 최근 쿠키/crumb 없이는
// 401을 자주 돌려주기 때문에, 그 인증 처리를 main.js 쪽에서 전담하고 여기서는 결과만 받는다.
async function fetchQuote(symbol){
  try{
    const raw=await ipcRenderer.invoke('fetch-yahoo','chart',symbol)
    if(!raw)return null
    const d=JSON.parse(raw)
    const m=d.chart&&d.chart.result&&d.chart.result[0]&&d.chart.result[0].meta
    if(!m)return null
    const pr=m.regularMarketPrice,pv=m.chartPreviousClose
    if(typeof pr!=='number'||typeof pv!=='number'||!isFinite(pr)||!isFinite(pv))return null
    const isKR=/\.(KS|KQ)$/i.test(symbol)||symbol.indexOf('KS11')>=0||symbol.indexOf('KQ11')>=0
    return {price:pr,change:pr-pv,pct:(pr-pv)/pv*100,isKR}
  }catch(e){return null}
}
function fmtQuotePrice(q){
  return q.isKR?Math.round(q.price).toLocaleString():'$'+q.price.toFixed(2)
}
function fmtQuoteChange(q){
  const sg=q.change>0?'+':''
  return sg+(Math.abs(q.change)>100?Math.round(q.change):q.change.toFixed(2))+' ('+sg+q.pct.toFixed(2)+'%)'
}

    list=Array.isArray(parsed)?parsed.filter(x=>x&&x.s):JSON.parse(JSON.stringify(DEFAULT_STOCKS))
  }catch(e){list=JSON.parse(JSON.stringify(DEFAULT_STOCKS))}

  function sv(){
    try{localStorage.setItem(K,JSON.stringify(list))}catch(e){}
  }

  function render(){
    con.innerHTML=''
    if(!list.length){
      const e=document.createElement('div');e.className='nst';e.textContent='위에서 회사를 검색해 추가해보세요'

      const sy=document.createElement('span');sy.className='ssym';sy.textContent=x.n||x.s
      const nm=document.createElement('span');nm.className='sname';nm.textContent=x.s.replace(/\^/g,'').replace(/\.(KS|KQ)$/i,'')
      l.appendChild(sy);l.appendChild(nm)
      const rightWrap=document.createElement('div');rightWrap.className='st-right'
      const r=document.createElement('div');r.className='str'
      const p=document.createElement('span');p.className='sp';p.id='sp-'+k;p.textContent='-'

      r.appendChild(p);r.appendChild(c)

      it.appendChild(l);it.appendChild(rightWrap)
      it.addEventListener('click',e=>{e.stopPropagation();shell.openExternal(x.u||stockUrlFor(x.s))})
      del.addEventListener('click',e=>{e.stopPropagation();list.splice(i,1);sv();render()})
      con.appendChild(it)
    })
  }

  function addStock(symbol,name){
    symbol=String(symbol||'').trim()
    if(!symbol)return
    if(list.some(x=>x.s.toLowerCase()===symbol.toLowerCase())){
      hideResults();return
    }
    list.push({s:symbol,n:(name||symbol).trim(),u:stockUrlFor(symbol)})
    sv();render();hideResults()
    load()

  function hideResults(){
    if(!results)return
    results.classList.remove('show');results.innerHTML=''
  }

  let searchTimer=null
  let searchSeq=0
  function runSearch(q){
    q=q.trim()
    clearTimeout(searchTimer)
    if(!q){hideResults();return}
    searchTimer=setTimeout(async ()=>{
      if(!results)return
      const mySeq=++searchSeq
      results.innerHTML='<div class="stock-result-empty">검색 중...</div>'
      results.classList.add('show')

      // 1) 한글 별칭 사전 + 국내(코스피·코스닥) 상장사 목록에서 먼저 찾는다.
      //    이렇게 하면 "애플"처럼 한글로 쳐도 바로 찾아지고, 국내 종목도 폭넓게 잡힌다.
      const local=localStockMatches(q)

      // 2) Yahoo Finance 검색(자동완성) API — 회사명/티커로 더 폭넓게 찾아준다.
      //    (main 프로세스가 쿠키/crumb 인증을 대신 처리해준다)
      let apiResults=[]
      try{
        const raw=await ipcRenderer.invoke('fetch-yahoo','search',q)
        if(raw){
          const d=JSON.parse(raw)
          const quotes=Array.isArray(d.quotes)?d.quotes:[]
          apiResults=quotes.filter(x=>x&&x.symbol).map(x=>({
            symbol:x.symbol,
            name:x.shortname||x.longname||x.exchDisp||x.typeDisp||x.symbol
          }))
        }
      }catch(e){
        console.error('[WCW] 주식 검색(Yahoo) 실패:',e)
      }

      if(mySeq!==searchSeq)return // 그 사이 검색어가 바뀌었으면 이 결과는 버린다

      // 로컬(한글) 결과를 우선하고, 같은 심볼은 중복 제거한다.
      const seen=new Set()
      const merged=[]
      local.concat(apiResults).forEach(x=>{
        const key=x.symbol.toUpperCase()
        if(seen.has(key))return
        seen.add(key);merged.push(x)
      })
      const valid=merged.slice(0,12)

      results.innerHTML=''
      if(!valid.length){
        results.innerHTML='<div class="stock-result-empty">검색 결과가 없어요</div>'
        return
      }

      valid.forEach(x=>{
        const row=document.createElement('div');row.className='stock-result-item'

        const left=document.createElement('div');left.className='stock-result-left'
        const sym=document.createElement('span');sym.className='stock-result-sym';sym.textContent=x.symbol
        const nm=document.createElement('span');nm.className='stock-result-name'
        nm.textContent=x.name+(x.sub?' · '+x.sub:'')
        left.appendChild(sym);left.appendChild(nm)

        const right=document.createElement('div');right.className='stock-result-right'
        const meta=document.createElement('div');meta.className='stock-result-meta'
        const mp=document.createElement('span');mp.className='srp';mp.textContent='···'
        const mc=document.createElement('span');mc.className='src'
        meta.appendChild(mp);meta.appendChild(mc)
        const addBtn=document.createElement('button');addBtn.className='stock-result-add';addBtn.title='관심목록에 추가'
        addBtn.appendChild(svgIc('i-plus'))
        right.appendChild(meta);right.appendChild(addBtn)

        row.appendChild(left);row.appendChild(right)
        row.addEventListener('mousedown',e=>e.preventDefault()) // input blur보다 클릭이 먼저 처리되게

        // 결과를 클릭하면 그 종목의 페이지로 바로 이동한다.
        row.addEventListener('click',e=>{
          e.stopPropagation()
          shell.openExternal(stockUrlFor(x.symbol))
        })
        // + 버튼은 페이지 이동과 별개로 관심목록에 추가한다.
        addBtn.addEventListener('click',e=>{
          e.stopPropagation()
          addStock(x.symbol,x.name)
          if(searchIn)searchIn.value=''
        })

        results.appendChild(row)

        // 옆에 현재가·등락률을 채워 넣는다.
        fetchQuote(x.symbol).then(q=>{
          if(!q||mySeq!==searchSeq)return
          mp.textContent=fmtQuotePrice(q)
          mc.textContent=fmtQuoteChange(q)
          mc.className='src '+(q.change>0?'cup':q.change<0?'cdn':'')
        }).catch(()=>{mp.textContent='-'})
      })
    },400)
  }

  if(searchIn){
    searchIn.addEventListener('mousedown',e=>e.stopPropagation())
    searchIn.addEventListener('input',e=>runSearch(e.target.value))
    searchIn.addEventListener('keydown',e=>{
      e.stopPropagation()
      if(e.key==='Escape'){hideResults();searchIn.blur()}
    })
    searchIn.addEventListener('blur',()=>{
      // 검색 결과를 클릭하는 mousedown이 blur보다 먼저 막히도록 처리했으므로
      // 약간의 지연 없이 바로 닫아도 안전하다.
      hideResults()
    })
  }

  async function load(){
    for(const x of list){
      try{
        const q=await fetchQuote(x.s)
        if(!q)continue
        const k=stockKey(x.s)
        const pe=w.querySelector('#sp-'+k),ce=w.querySelector('#sc-'+k)
        if(pe)pe.textContent=fmtQuotePrice(q)
        if(ce){ce.textContent=fmtQuoteChange(q);ce.className='sc '+(q.change>0?'cup':q.change<0?'cdn':'')}
      }catch(e){
        console.error('[WCW] 주식 시세 갱신 실패('+x.s+'):',e)
      }
    }
    const u=w.querySelector('.sup')
    if(u)u.textContent='업데이트: '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})
  }
  render()
  load();regTimer(w,setInterval(load,5*60*1000))
}
